<meta charset="utf-8">
<title>UPIIXIA Agentic Kit tutorial</title>
<!-- UAK-199: the tutorial, drawn with the kit's own design system. Every frame is a pure function of t (seconds):
     render.mjs serves this folder and kit/.uak/bin/lib/ from disk, calls window.seek(t) and takes a screenshot.
     The wizard scenes use the stylesheet of kit/.uak/bin/lib/setup.html, the dashboard scenes the one of dash.html,
     each in its own shadow root, read when the page loads: a change of the product's look shows in the next render.
     The scenes and their seconds are the JSON below; captions.json holds the captions on the same seconds and
     test_setup_tutorial.py checks that both agree. -->
<script type="application/json" id="scenes">[

<script>
"use strict";
const SCENES = JSON.parse(document.getElementById("scenes").textContent);
window.DURATION = SCENES[SCENES.length - 1].end;
const ZOOM = { wiz: 1.6, dash: 1.45 }; // the wizard is laid out at 800x450, the dashboard at 883x497; both fill 1280x720
const PROJECT = "cafe-turnos", WHERE = "~/proyectos/cafe-turnos";

// ---- the product's own stylesheets, in two shadow roots --------------------------------------------------------------
// :root, html and body become .pg (the page of a scene), so the tokens of the palette apply inside the shadow root.
function adopt(html) {
  let css = html.slice(html.indexOf("<style>") + 7, html.indexOf("</style>"));
  css = css.replace(/@font-face\s*\{[^}]*\}/g, "").replace(/:root/g, ".pg")
    .replace(/(^|[\s,}])(html|body)(?=[\s{\[.:,])/g, "$1.pg");
  return css;
}
// What a scene needs beyond the product's rules: the page at 800x450, no motion of its own, the pressed state that a
// pointer gives (the product's :hover rules, as a class), and the few sizes a 16:9 frame asks for.
const COMMON = `
  .pg { overflow: hidden; position: relative; }
  .pg *, .pg *::before, .pg *::after { animation: none !important; transition: none !important; }
  .hov.primary:not(:disabled), .hov.btn:not(:disabled) { background: color-mix(in srgb, var(--btn) 86%, var(--ink)); }
  .hov.secondary-button, .hov.ghost, .hov.chip, .hov.ab, .hov.hnd { background: var(--hover); color: var(--ink); }
  .press { outline: 2px solid var(--accent-line); outline-offset: 2px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; }
`;
const WIZ = COMMON + `
  .pg { zoom: ${ZOOM.wiz}; width: 800px; height: 450px; }
  .scr { display: flex; flex-direction: column; height: 386px; }
  .scr .wz-body { width: 100%; }
  .wz-main .nodes li { white-space: nowrap; font-size: 12px; }
  .wz-top { padding: 10px 24px 8px; }
  .wz-body { grid-template-columns: minmax(0, 1fr) 312px; gap: 20px; padding: 14px 24px 0; flex: 1; overflow: hidden; align-content: start; }
  .wz-main > * + * { margin-top: 10px; }
  .wz-main h1 { font-size: 22px; }
  .foot { position: static; }
  .foot-in { padding: 10px 24px; max-width: none; }
  .win-b { font-size: 11.5px; line-height: 1.65; }
  .win-h { gap: 6px; }
  .win-h > span { margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 12px; }
  .found li, .plain > li, .rules > li { padding: 7px 12px; }
  .term-b { padding: 12px 14px; font: 500 12.5px/1.75 var(--mono); color: var(--ink); white-space: pre; }
  .term-b .p { color: var(--accent-ink); }
  .term-b .o { color: var(--integrated-ink); }
  .term-b .m { color: var(--muted); }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--ink); vertical-align: -2px; }
  /* the title: a frame of the same language (the brand, the window, the line of nodes) */
  .ttl { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: center; padding: 74px 40px 0; }
  .ttl h1 { font-size: 34px; line-height: 1.12; letter-spacing: -.025em; max-width: 14ch; margin: 14px 0 12px; }
  .ttl p { font-size: 15px; color: var(--ink-2); max-width: 34ch; }
  .ttl .brand { font-size: 16px; }
  .ttl .mark { width: 32px; height: 32px; }
  .ttl .win-b { font-size: 13px; line-height: 1.75; }
  .ttl .win-h > span { font-size: 12px; }
  .ttl-nodes { padding: 48px 40px 0; }
  .ttl .pill { font-size: 12px; padding: 6px 10px; }
  .ttl-nodes li { font-size: 13px; white-space: nowrap; color: var(--ink-2); }
  .ttl-nodes i { width: 11px !important; height: 11px !important; }
`;
const DASH = COMMON + `
  .pg { zoom: ${ZOOM.dash}; width: 883px; height: 497px; }
  .app { min-height: 0; height: 497px; overflow: hidden; }
  .tabs { height: 497px; padding: 12px 8px; }
  .rows > li { grid-template-columns: 90px 60px minmax(0, 1fr) 64px 104px; gap: 10px; }
  #tip { position: absolute; opacity: 1; }
  .head { padding: 10px 20px; }
  .page { grid-template-columns: minmax(0, 1fr) 240px; padding: 12px 20px 0; gap: 14px; }
  .wide { padding: 12px 20px 0; }
  .col { gap: 12px; }
  .agrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 50; }
  .dlg { position: absolute; z-index: 60; left: 50%; top: 22px; width: 430px; margin-left: -215px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
  .card-img { border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); padding: 18px 20px 12px; }
  .card-img .top { display: flex; align-items: flex-start; gap: 10px; }
  .card-img .nm { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .card-img .since { font-size: 9px; color: var(--muted); }
  .card-img .pc { margin-left: auto; text-align: right; }
  .card-img .pc b { display: block; font-size: 30px; line-height: 1; color: var(--accent-ink); letter-spacing: -.02em; }
  .card-img .pc small { font-size: 9px; color: var(--ink-2); }
  .card-img .bar { height: 3px; width: 120px; margin: 6px 0 0 auto; background: var(--line); border-radius: 2px; overflow: hidden; }
  .card-img .bar i { display: block; height: 100%; background: var(--accent-line); }
  .card-img .figs { display: flex; gap: 26px; margin: 22px 0 18px; }
  .card-img .figs b { display: block; font-size: 22px; letter-spacing: -.02em; }
  .card-img .figs span { font-size: 9px; color: var(--ink-2); }
  .card-img .ids { display: flex; gap: 6px; align-items: center; }
  .card-img .credit { text-align: right; font-size: 7px; color: var(--muted); margin-top: 6px; }
  .arr .hbar .hnd { width: 26px; height: 26px; }
`;

const hosts = {};
async function mount(id, css, theme) {
  const host = document.getElementById(id), root = host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>${css}</style><div class="pg" data-pal="lavanda" data-theme="light"></div>`;
  hosts[id] = { host, root, pg: root.querySelector(".pg") };
}
window.ready = (async () => {
  const [setup, dash] = await Promise.all(["/kit/.uak/bin/lib/setup.html", "/kit/.uak/bin/lib/dash.html"].map(async (p) => {
    const r = await fetch(p);
    if (!r.ok) throw new Error("cannot read " + p);
    return r.text();
  }));
  await mount("wiz", adopt(setup) + WIZ);
  await mount("dash", adopt(dash) + DASH);
  await Promise.all([document.fonts.load("400 13px Inter"), document.fonts.load("700 13px Inter"), document.fonts.load("500 12px 'JetBrains Mono'")]);
  if (!document.fonts.check("13px Inter") || !document.fonts.check("12px 'JetBrains Mono'")) throw new Error("the kit's fonts did not load");
  return true;
})();

// ---- small helpers ---------------------------------------------------------------------------------------------------
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function typed(text, lt, t0, cps) { return text.slice(0, clamp(Math.floor((lt - t0) * cps), 0, text.length)); }
const MARK = '<svg width="16" height="16" viewBox="0 0 5 5" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h1v4H0zM4 0h1v5H4zM1 4h3v1H1zM2 1h1v1H2z"/></svg>';
const IC = {
  check: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>',
  ok: '<svg viewBox="0 0 16 16" class="ic"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13M5.3 8.2l1.8 1.8 3.6-3.8"/></svg>',
  eye: '<svg viewBox="0 0 16 16" class="ic"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8ZM8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>',
  copy: '<svg viewBox="0 0 16 16" class="ic"><path d="M5.5 5.5h7v8h-7zM3.5 10.5v-8h7"/></svg>',
  share: '<svg viewBox="0 0 16 16" class="ic"><path d="M8 10V2M5 5l3-3 3 3M3 9v4h10V9"/></svg>',
  edit: '<svg viewBox="0 0 16 16" class="ic"><path d="M3 13h3l7-7-3-3-7 7zM9 4l3 3"/></svg>',
  x: '<svg viewBox="0 0 16 16" class="ic"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>',
  up: '<svg viewBox="0 0 16 16" class="ic"><path d="M8 13V3M4 7l4-4 4 4"/></svg>',
  down: '<svg viewBox="0 0 16 16" class="ic"><path d="M8 3v10M4 9l4 4 4-4"/></svg>',
  col: '<svg viewBox="0 0 16 16" class="ic"><path d="M2.5 3h11v10h-11zM9 3v10"/></svg>',
  hide: '<svg viewBox="0 0 16 16" class="ic"><path d="M2 2l12 12M6.5 6.6a2 2 0 0 0 2.9 2.8M4.3 4.4C2.6 5.5 1.5 8 1.5 8s2.4 4.5 6.5 4.5c1.3 0 2.4-.4 3.4-1M8 3.5c4.1 0 6.5 4.5 6.5 4.5s-.5 1-1.5 2.1"/></svg>',
  grip: '<svg viewBox="0 0 16 16" class="ic"><path d="M6 4h.01M10 4h.01M6 8h.01M10 8h.01M6 12h.01M10 12h.01"/></svg>',
  find: '<svg viewBox="0 0 16 16" class="ic"><path d="M7 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9M10.5 10.5 14 14"/></svg>',
};
const TABS = [["Overview", "M2 7.5 8 2.5l6 5M3.5 6.5V13h3.5V9.5h2V13h3.5V6.5"], ["Board", "M2.5 3h3v10h-3zM6.5 3h3v6h-3zM10.5 3h3v8h-3z"],
  ["Agents", "M6 7a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5M1.5 14c0-3 2-5 4.5-5s4.5 2 4.5 5M11 3a2.5 2.5 0 0 1 0 4.5M12.5 9.2c1.4.6 2 2.3 2 4.8"],
  ["Messages", "M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"], ["Black box", "M2.5 5 8 2.5 13.5 5v6L8 13.5 2.5 11zM2.5 5 8 7.5 13.5 5M8 7.5v6"],
  ["Memory", "M3 2.5h8a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2zM5 11.5h8"],
  ["Tokens", "M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11M8 5v6M6.2 9.5c.3.5 1 .8 1.8.8 1 0 1.8-.4 1.8-1.1S9 8 8 7.8 6.3 7.4 6.3 6.7 7 5.7 8 5.7c.7 0 1.3.3 1.6.8"]];

// The dashboard's identicon (dash.html idcells): the pattern from the human's name, the hue from the agent's.
function fnv(s) { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x >>> 0; }
function idc(name, human, size) {
  const bits = fnv("p:" + (human || name)), on = [];
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) if ((bits >> (y * 3 + x)) & 1) { on.push([x, y]); if (x !== 2) on.push([4 - x, y]); }
  const hue = Math.round((fnv("c:" + name) * 137.508) % 360);
  return `<svg viewBox="-1 -1 7 7" width="${size}" height="${size}" class="idc" style="--h:${hue}"><rect x="-1" y="-1" width="7" height="7" class="bg"/>` +
    (on.length ? on : [[2, 2]]).map(([x, y]) => `<rect x="${x}" y="${y}" width="1.02" height="1.02" class="px"/>`).join("") + "</svg>";
}

// ---- the wizard (kit/.uak/bin/lib/setup.html) ------------------------------------------------------------------------
const STEPS = ["Project detected", "Rules", "People", "Schedule", "Publish the kit", "Idea and plan", "Start the agents"];
function wzTop(cur) {
  return `<header class="wz-top"><div class="brand"><span class="mark">${MARK}</span><b>UPIIXIA</b></div>
    <nav class="journey"><ol class="nodes">${STEPS.map((s, i) => `<li class="${i < cur ? "done" : ""}"${i === cur ? ' aria-current="step"' : ""}><i></i><span>${s}</span></li>`).join("")}</ol></nav>
    <details class="ap term"><summary><span class="long">Continue in the terminal</span></summary></details>
    <div class="profile"><details class="ap"><summary><i></i>Apariencia</summary></details></div></header>`;
}
function win(title, rows, figs) {
  return `<div class="wz-prev"><div class="win"><div class="win-h"><i></i><i></i><i></i><span>${esc(title)}</span></div>
    <div class="win-b">${rows.map(([k, a, b]) => `<div class="row ${k}"><span>${esc(a)}</span><span>${esc(b || "")}</span></div>`).join("")}</div>
    ${figs ? `<div class="win-f">${figs.map(([n, l]) => `<span><b>${esc(n)}</b>${esc(l)}</span>`).join("")}</div>` : ""}</div></div>`;
}
function foot(note, buttons) {
  return `<div class="foot"><div class="foot-in"><button class="secondary-button" type="button">Exit</button><p class="foot-note">${note || ""}</p>${buttons}</div></div>`;
}
function screen(cur, main, side, footer) {
  return `<div class="scr">${wzTop(cur)}<div class="wz-body"><div class="wz-main">${main}</div>${side}</div>${footer}</div>`;
}
const kv = (rows, cls) => `<ul class="${cls || "found"} list">${rows.map(([k, v]) => `<li><span class="k">${k}</span><span class="v">${v}</span></li>`).join("")}</ul>`;
const WRITTEN = [["", PROJECT + "/", ""], ["add", "  .uak/ engine, docs, templates", "~175"], ["add", "  .claude/ Claude Code", "19"],
  ["add", "  .codex/ Codex", "7"], ["add", "  AGENTS.md  .mcp.json", ""], ["mod", "  .gitignore", "lines added"], ["keep", "  your code", "untouched"]];
const WRITTEN_FIGS = [["~201", "files added"], ["2", "tools"], ["0", "files replaced"]];

const SCENE = {};

SCENE.title = () => ({
  host: "wiz",
  html: `<div class="ttl"><div>
      <div class="brand"><span class="mark">${MARK}</span><b>UPIIXIA Agentic Kit</b></div>
      <h1>The setup page, then the dashboard</h1>
      <p style="margin-top:16px"><span class="pill">Demonstration · drawn screens</span></p>
    </div>
    ${win("tutorial · 74 s", [["", "0:08  setup page", ""], ["", "0:27  idea and plan", ""], ["", "0:35  your agents", ""], ["", "0:49  dashboard", ""]], [["10", "screens"], ["74 s", "long"], ["es · en", "captions"]])}
    </div>
    <div class="journey ttl-nodes"><ol class="nodes">${["Project", "Install", "Rules", "People", "Publish", "Plan", "Agents", "Dashboard"].map((s, i) =>
      `<li${i === 0 ? ' aria-current="step"' : ""}><i></i><span>${s}</span></li>`).join("")}</ol></div>`,
});

SCENE.terminal = (lt) => {
  const cmd = "bash ~/upiixia-agentic-kit/install.sh --wizard .";
  const shown = typed(cmd, lt, 0.4, 30), done = shown.length === cmd.length, out = lt >= 2.3;
  const caret = !out && Math.floor(lt * 2.5) % 2 === 0 ? '<span class="caret"></span>' : "";
  const lines = [`<span class="p">${esc(WHERE)} $</span> ${esc(shown)}${done && !out ? "" : caret}`];
  if (out) {
    lines.push('<span class="o">UAK SETUP http://127.0.0.1:8765/</span>');
    lines.push('<span class="m">Keep this terminal open. The page opens from that file</span>');
    lines.push('<span class="m">with a one-time code (valid 120 seconds, used once).</span>');
  }
  return {
    host: "wiz",
    html: `<div style="padding:78px 56px 0"><div class="win"><div class="win-h"><i></i><i></i><i></i><span>terminal · ${esc(WHERE)}</span></div>
      <div class="term-b" style="font-size:15px;min-height:150px;padding:16px 18px">${lines.join("\n")}</div></div></div>`,
  };
};

SCENE.project = (lt) => ({
  host: "wiz",
  html: screen(0, `<h1>Check what we found in this project</h1>
      <p class="where"><span class="mono">${WHERE}</span> <button type="button" class="link-button">Change</button></p>
      ${kv([["Repository", "New: no commits yet"]])}
      <fieldset class="q" style="margin-top:12px"><legend>Work mode</legend><div class="opts">
        <label class="choice"><input type="radio" name="m"><span><strong>Product with real users</strong><small>No deadline. A human makes the final merge decision.</small></span></label>
        <label class="choice"><input type="radio" name="m" checked><span><strong>Hackathon or prototype <em class="tag">Proposed</em></strong><small>A deadline and a freeze before the demo.</small></span></label>
      </div></fieldset>`,
    win(PROJECT + " · what will be written", WRITTEN, WRITTEN_FIGS),
    foot("", '<button class="primary" type="button" id="go">Continue</button>')),
  cursor: [{ t: 0.4, at: [620, 250] }, { t: 3.4, sel: "#go", click: true }],
});

SCENE.install = (lt) => {
  const busy = lt >= 1.9, secs = Math.max(1, Math.floor(lt - 1.9) + 1);
  return {
    host: "wiz",
    html: screen(0, `<h1>Install the kit into this project</h1>
        <p class="says">Installing adds about 201 files to ${PROJECT}. Nothing is committed or pushed.</p>
        ${kv([["Workflow", "Hackathon or prototype"], ["Coding tools", "Claude Code, Codex"], ["Your files", "Existing files are kept."]])}
        ${busy ? `<div class="list" style="padding:8px 12px;background:var(--accent-wash);border-color:var(--accent-line)">Installing your workspace. Working in the background.</div>` : ""}`,
      win(PROJECT + " · what will be written", WRITTEN, WRITTEN_FIGS),
      foot(busy ? `Installing the kit · ${secs} s` : "", `<button class="secondary-button" type="button">Back</button><button class="primary" type="button" id="go"${busy ? ' disabled' : ""}>${busy ? '<span class="spin" style="transform:rotate(' + Math.round(lt * 400) % 360 + 'deg)"></span>Installing…' : "Install the kit"}</button>`)),
    cursor: [{ t: 0.3, at: [560, 300] }, { t: 1.8, sel: "#go", click: true }, { t: 3.2, at: [700, 300] }],
  };
};

SCENE.team = (lt) => {
  if (lt < 2.6) {
    return {
      host: "wiz",
      html: screen(1, `<h1>Confirm how your team will work</h1>
          <p class="says">These are the defaults of Hackathon mode. Nothing is written until you confirm.</p>
          <ul class="rules list">
            <li><span><strong>Tests come first</strong><span class="why">An agent writes the failing test before the code.</span></span><span class="val">Required</span></li>

      <div class="agrid">${AGENTS.map(card).join("")}</div></section>
      <section><div class="bh"><h2>People</h2><span class="n">3</span><div class="x">the humans of the project</div></div></section></div></section>`),
  };
};
SCENE.arrange = (lt) => {
  const st = states(0, true), arranging = lt >= 0.8 && lt < 3.0, moved = lt >= 1.9;
  return {
    host: "dash",
    html: dApp(0, summary(st, { phase: "merged", arranging, lt, order: moved ? ["needs", "tasks", "map"] : ["needs", "map", "tasks"] })),
    cursor: [{ t: 0.0, at: [560, 300] }, { t: 0.6, sel: "#edit", click: true }, { t: 1.7, sel: moved ? "#up-map" : "#up-tasks", click: true }, { t: 2.8, sel: "#done", click: true }],
  };
};
SCENE.share = (lt) => {
  const st = states(0, true), open = lt >= 0.9, c = counts(st);
  const card = `<div class="card-img"><div class="top">${idc(PROJECT, PROJECT, 34)}<div><div class="nm">${PROJECT}</div><div class="since">since Nov 14, 2026</div></div>
      <div class="pc"><b>${Math.round(100 * c.INTEGRATED / PLAN.length)}%</b><small>Integrated</small><div class="bar"><i style="width:${100 * c.INTEGRATED / PLAN.length}%"></i></div></div></div>
      <div class="figs"><div><b>41.2M</b><span>Tokens spent</span></div><div><b>4</b><span>Agents</span></div><div><b>${c.INTEGRATED} / ${PLAN.length}</b><span>Integrated</span></div><div><b>96</b><span>Commits on main</span></div></div>
      <div class="ids">${AGENTS.map(([a, h]) => idc(a, h, 20)).join("")}</div><div class="credit">UPIIXIA Agentic Kit</div></div>`;
  const dlg = open ? `<div class="scrim"></div><div class="dlg"><div class="pad"><div class="bh"><h2>Share</h2><button class="st-x chip" type="button" style="margin:0 0 0 auto;border:0">${IC.x}</button></div>
      <div class="fsw" style="margin:0 0 10px"><button class="chip" type="button" aria-pressed="true" style="min-height:30px">1200 x 630</button><button class="chip" type="button" aria-pressed="false" style="min-height:30px">Story 1080 x 1920</button></div>
      ${card}<div class="chips acts" style="margin-top:10px;display:flex;gap:8px"><button class="chip" type="button">Copy image</button><button class="chip" type="button" id="dl">Download PNG</button></div></div></div>` : "";
  return { host: "dash", html: dApp(0, summary(st, { phase: "merged" }), dlg), cursor: [{ t: 0.0, at: [600, 300] }, { t: 0.7, sel: "#share-btn", click: true }, { t: 2.6, sel: "#dl" }] };
};

// ---- the frame ------------------------------------------------------------------------------------------------------
const cursorEl = document.getElementById("cursor");
function where(root, k, zoom) {
  if (k.at) return { x: k.at[0] * zoom, y: k.at[1] * zoom };
  const el = root.querySelector(k.sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width * 0.55, y: r.top + r.height * 0.55, el };
}
function placeCursor(root, keys, lt, zoom) {
  if (!keys || !keys.length) { cursorEl.hidden = true; return; }
  const pts = [];
  keys.forEach((k) => { const w = where(root, k, zoom) || (pts.length ? { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y } : { x: 640, y: 400 }); pts.push(Object.assign({}, k, w)); });
  let i = 0;
  while (i < pts.length - 1 && lt >= pts[i + 1].t) i++;
  const a = pts[i], b = pts[i + 1];
  let x = a.x, y = a.y;
  if (b && lt > a.t) {
    const travel = Math.min(0.8, b.t - a.t), f = ease((lt - (b.t - travel)) / travel);
    x = a.x + (b.x - a.x) * f; y = a.y + (b.y - a.y) * f;
  }
  // The pointer reaches its target: the product's hover look; a click: its focus ring and a short press.
  const near = b && lt > b.t - 0.25 ? b : a;
  let scale = 1;
  pts.forEach((p) => {
    if (!p.el) return;
    if (lt >= p.t - 0.25 && lt < p.t + 0.35 && (p === near || p === a)) p.el.classList.add("hov");
    if (p.click && lt >= p.t && lt < p.t + 0.3) { p.el.classList.add("press"); scale = 0.85; }
  });
  cursorEl.hidden = false;
  cursorEl.style.transform = `translate(${(x - 3).toFixed(1)}px, ${(y - 3).toFixed(1)}px) scale(${scale})`;
}
window.seek = (t) => {
  t = clamp(t, 0, window.DURATION - 1e-6);
  const scene = SCENES.find((s) => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
  const lt = t - scene.start, view = SCENE[scene.id](lt);
  for (const id of Object.keys(hosts)) hosts[id].host.hidden = id !== view.host;
  const h = hosts[view.host];
  h.pg.innerHTML = view.html;
  placeCursor(h.root, view.cursor, lt, ZOOM[view.host]);
  return scene.id;
};
