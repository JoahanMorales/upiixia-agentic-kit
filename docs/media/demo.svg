<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.724%{opacity:0}1.762%,100%{opacity:1}}.l0{animation:l0 26.10s infinite}@keyframes l1{0%,5.938%{opacity:0}5.977%,100%{opacity:1}}.l1{animation:l1 26.10s infinite}@keyframes l2{0%,6.541%{opacity:0}6.580%,100%{opacity:1}}.l2{animation:l2 26.10s infinite}@keyframes l3{0%,6.771%{opacity:0}6.810%,100%{opacity:1}}.l3{animation:l3 26.10s infinite}@keyframes l4{0%,7.001%{opacity:0}7.039%,100%{opacity:1}}.l4{animation:l4 26.10s infinite}@keyframes l5{0%,7.231%{opacity:0}7.269%,100%{opacity:1}}.l5{animation:l5 26.10s infinite}@keyframes l6{0%,7.461%{opacity:0}7.499%,100%{opacity:1}}.l6{animation:l6 26.10s infinite}@keyframes l7{0%,11.301%{opacity:0}11.339%,100%{opacity:1}}.l7{animation:l7 26.10s infinite}@keyframes l8{0%,15.515%{opacity:0}15.553%,100%{opacity:1}}.l8{animation:l8 26.10s infinite}@keyframes l9{0%,15.745%{opacity:0}15.783%,100%{opacity:1}}.l9{animation:l9 26.10s infinite}@keyframes l10{0%,15.975%{opacity:0}16.013%,100%{opacity:1}}.l10{animation:l10 26.10s infinite}@keyframes l11{0%,16.204%{opacity:0}16.243%,100%{opacity:1}}.l11{animation:l11 26.10s infinite}@keyframes l12{0%,16.434%{opacity:0}16.473%,100%{opacity:1}}.l12{animation:l12 26.10s infinite}@keyframes l13{0%,16.664%{opacity:0}16.703%,100%{opacity:1}}.l13{animation:l13 26.10s infinite}@keyframes l14{0%,16.894%{opacity:0}16.932%,100%{opacity:1}}.l14{animation:l14 26.10s infinite}@keyframes l15{0%,17.124%{opacity:0}17.162%,100%{opacity:1}}.l15{animation:l15 26.10s infinite}@keyframes l16{0%,20.966%{opacity:0}21.004%,100%{opacity:1}}.l16{animation:l16 26.10s infinite}@keyframes l17{0%,24.561%{opacity:0}24.599%,100%{opacity:1}}.l17{animation:l17 26.10s infinite}@keyframes l18{0%,24.791%{opacity:0}24.829%,1