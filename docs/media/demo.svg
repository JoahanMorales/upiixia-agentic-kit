<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.716%{opacity:0}1.754%,100%{opacity:1}}.l0{animation:l0 26.23s infinite}@keyframes l1{0%,5.910%{opacity:0}5.948%,100%{opacity:1}}.l1{animation:l1 26.23s infinite}@keyframes l2{0%,6.584%{opacity:0}6.622%,100%{opacity:1}}.l2{animation:l2 26.23s infinite}@keyframes l3{0%,6.813%{opacity:0}6.851%,100%{opacity:1}}.l3{animation:l3 26.23s infinite}@keyframes l4{0%,7.042%{opacity:0}7.080%,100%{opacity:1}}.l4{animation:l4 26.23s infinite}@keyframes l5{0%,7.270%{opacity:0}7.308%,100%{opacity:1}}.l5{animation:l5 26.23s infinite}@keyframes l6{0%,7.499%{opacity:0}7.537%,100%{opacity:1}}.l6{animation:l6 26.23s infinite}@keyframes l7{0%,11.319%{opacity:0}11.357%,100%{opacity:1}}.l7{animation:l7 26.23s infinite}@keyframes l8{0%,15.513%{opacity:0}15.551%,100%{opacity:1}}.l8{animation:l8 26.23s infinite}@keyframes l9{0%,15.742%{opacity:0}15.780%,100%{opacity:1}}.l9{animation:l9 26.23s infinite}@keyframes l10{0%,15.971%{opacity:0}16.009%,100%{opacity:1}}.l10{animation:l10 26.23s infinite}@keyframes l11{0%,16.200%{opacity:0}16.238%,100%{opacity:1}}.l11{animation:l11 26.23s infinite}@keyframes l12{0%,16.428%{opacity:0}16.466%,100%{opacity:1}}.l12{animation:l12 26.23s infinite}@keyframes l13{0%,16.657%{opacity:0}16.695%,100%{opacity:1}}.l13{animation:l13 26.23s infinite}@keyframes l14{0%,16.886%{opacity:0}16.924%,100%{opacity:1}}.l14{animation:l14 26.23s infinite}@keyframes l15{0%,17.115%{opacity:0}17.153%,100%{opacity:1}}.l15{animation:l15 26.23s infinite}@keyframes l16{0%,20.935%{opacity:0}20.973%,100%{opacity:1}}.l16{animation:l16 26.23s infinite}@keyframes l17{0%,25.066%{opacity:0}25.104%,100%{opacity:1}}.l17{animation:l17 26.23s infinite}@keyframes l18{0%,25.295%{opacity:0}25.333%,1