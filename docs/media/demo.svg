pacity:1}}.l39{animation:l39 22.24s infinite}@keyframes l40{0%,61.830%{opacity:0}61.875%,100%{opacity:1}}.l40{animation:l40 22.24s infinite}@keyframes l41{0%,62.100%{opacity:0}62.145%,100%{opacity:1}}.l41{animation:l41 22.24s infinite}@keyframes l42{0%,66.609%{opacity:0}66.654%,100%{opacity:1}}.l42{animation:l42 22.24s infinite}@keyframes l43{0%,69.063%{opacity:0}69.108%,100%{opacity:1}}.l43{animation:l43 22.24s infinite}@keyframes l44{0%,69.332%{opacity:0}69.377%,100%{opacity:1}}.l44{animation:l44 22.24s infinite}@keyframes l45{0%,69.602%{opacity:0}69.647%,100%{opacity:1}}.l45{animation:l45 22.24s infinite}@keyframes l46{0%,73.195%{opacity:0}73.240%,100%{opacity:1}}.l46{animation:l46 22.24s infinite}@keyframes l47{0%,73.464%{opacity:0}73.509%,100%{opacity:1}}.l47{animation:l47 22.24s infinite}@keyframes l48{0%,73.734%{opacity:0}73.779%,100%{opacity:1}}.l48{animation:l48 22.24s infinite}@keyframes l49{0%,74.004%{opacity:0}74.049%,100%{opacity:1}}.l49{animation:l49 22.24s infinite}@keyframes l50{0%,78.510%{opacity:0}78.555%,100%{opacity:1}}.l50{animation:l50 22.24s infinite}@keyframes l51{0%,79.005%{opacity:0}79.049%,100%{opacity:1}}.l51{animation:l51 22.24s infinite}@keyframes l52{0%,79.274%{opacity:0}79.319%,100%{opacity:1}}.l52{animation:l52 22.24s infinite}@keyframes l53{0%,79.544%{opacity:0}79.589%,100%{opacity:1}}.l53{animation:l53 22.24s infinite}@keyframes l54{0%,79.814%{opacity:0}79.859%,100%{opacity:1}}.l54{animation:l54 22.24s infinite}@keyframes l55{0%,80.083%{opacity:0}80.128%,100%{opacity:1}}.l55{animation:l55 22.24s infinite}@keyframes l56{0%,80.353%{opacity:0}80.398%,100%{opacity:1}}.l56{animation:l56 22.24s infinite}@keyframes l57{0%,80.625%{opacity:0}80.670%,100%{opacity:1}}.l57{animation:l57 22.24s infinite}@keyframes l58{0%,80.894%{opacity:0}80.939%,100%{opacity:1}}.l58{animation:l58 22.24s infinite}@keyframes l59{0%,81.164%{opacity:0}81.209%,100%{opacity:1}}.l59{animation:l59 22.24s infinite}@keyframes l60{0%,81.434%{opacity:0}81.479%,100%{opacity:1}}.l60{animation:l60 22.24s infinite}@keyframes l61{0%,81.704%{opacity:0}81.749%,100%{opacity:1}}.l61{animation:l61 22.24s infinite}@keyframes l62{0%,81.973%{opacity:0}82.018%,100%{opacity:1}}.l62{animation:l62 22.24s infinite}@keyframes scroll{0%{transform:translateY(0)}30.394%{transform:translateY(-17px)}30.664%{transform:translateY(-34px)}30.934%{transform:translateY(-51px)}31.203%{transform:translateY(-68px)}31.473%{transform:translateY(-85px)}31.743%{transform:translateY(-102px)}36.258%{transform:translateY(-119px)}41.203%{transform:translateY(-136px)}41.473%{transform:translateY(-153px)}41.742%{transform:translateY(-170px)}42.012%{transform:translateY(-187px)}42.282%{transform:translateY(-204px)}47.183%{transform:translateY(-221px)}49.707%{transform:translateY(-238px)}49.977%{transform:translateY(-255px)}54.482%{transform:translateY(-272px)}56.660%{transform:translateY(-289px)}56.930%{transform:translateY(-306px)}61.875%{transform:translateY(-323px)}62.145%{transform:translateY(-340px)}66.654%{transform:translateY(-357px)}69.108%{transform:translateY(-374px)}69.377%{transform:translateY(-391px)}69.647%{transform:translateY(-408px)}73.240%{transform:translateY(-425px)}73.509%{transform:translateY(-442px)}73.779%{transform:translateY(-459px)}74.049%{transform:translateY(-476px)}78.555%{transform:translateY(-493px)}79.049%{transform:translateY(-510px)}79.319%{transform:translateY(-527px)}79.589%{transform:translateY(-544px)}79.859%{transform:translateY(-561px)}80.128%{transform:translateY(-578px)}80.398%{transform:translateY(-595px)}80.670%{transform:translateY(-612px)}80.939%{transform:translateY(-629px)}81.209%{transform:translateY(-646px)}81.479%{transform:translateY(-663px)}81.749%{transform:translateY(-680px)}82.018%{transform:translateY(-697px)}100%{transform:translateY(-697px)}}.scroll{animation:scroll 22.24s steps(1,end) infinite}</style><rect width="100%" height="100%" rx="8" fill="#1e2127"/><circle cx="18" cy="14" r="5" fill="#e06c75"/><circle cx="36" cy="14" r="5" fill="#e5c07b"/><circle cx="54" cy="14" r="5" fill="#98c379"/><text x="438" y="18" fill="#7f848e" text-anchor="middle">bash .uak/bin/uak demo · real run, no AI key</text><clipPath id="c"><rect x="0" y="28" width="877" height="402"/></clipPath><g clip-path="url(#c)"><g class="scroll"><text class="l0" x="14" y="55" fill="#e5c07b">▶ A team repo with a backlog of 4 tasks (temp dir: ~/demo)</text><text class="l1" x="14" y="72" fill="#7f848e">SECRET_SCAN_PASS files=64 mode=staged</text><text class="l2" x="14" y="89" fill="#61afef">  planner$ bash .uak/bin/uak graph</text><text class="l3" x="14" y="106" fill="#d7dae0">    GRAPH 4 tasks · 2 waves · critical path 60 min: HACK-001 → HACK-003</text><text class="l4" x="14" y="123" fill="#d7dae0">    wave 1 (3): HACK-001 HACK-002 HACK-004</text><text class="l5" x="14" y="140" fill="#d7dae0">    wave 2 (1): HACK-003</text><text class="l6" x="14" y="157" fill="#e5c07b">▶ Three agents start at once — overlapping paths are rejected at claim time</text><text class="l7" x="14" y="174" fill="#61afef">  ana-1$ bash .uak/bin/wt new HACK-001 --agent ana-1</text><text class="l8" x="14" y="191" fill="#98c379">    OK claim HACK-001 | CLAIMED | attempt 1</text><text class="l9" x="14" y="208" fill="#98c379">    WT_READY: HACK-001 · branch feat/hack-001 · worktree ~/demo/team-wt/hack-001</text><text class="l10" x="14" y="225" fill="#7f848e">    Next: cd &quot;~/demo/team-wt/hack-001&quot; and open your agent there (claude / codex / cursor).</text><text class="l11" x="14" y="242" fill="#61afef">  bob-1$ bash .uak/bin/wt new HACK-002 --agent bob-1</text><text class="l12" x="14" y="259" fill="#98c379">    OK claim HACK-002 | CLAIMED | attempt 1</text><text class="l13" x="14" y="276" fill="#98c379">    WT_READY: HACK-002 · branch feat/hack-002 · worktree ~/demo/team-wt/hack-002</text><text class="l14" x="14" y="293" fill="#7f848e">    Next: cd &quot;~/demo/team-wt/hack-002&quot; and open your agent there (claude / codex / cursor).</text><text class="l15" x="14" y="310" fill="#61afef">  cy-1$ bash .uak/bin/wt new HACK-004 --agent cy-1</text><text class="l16" x="14" y="327" fill="#e06c75">    CONFLICT: HACK-004 overlaps HACK-001 (ana-1); pick another task.</text><text class="l17" x="14" y="344" fill="#98c379">  ✓ cy-1 cannot take HACK-004: it overlaps ana-1&#x27;s src/api.sh</text><text class="l18" x="14" y="361" fill="#61afef">  cy-1$ bash .uak/bin/uak next</text><text class="l19" x="14" y="378" fill="#d7dae0">    No eligible candidate (priority, dependencies, claims or authorization).</text><text class="l20" x="14" y="395" fill="#d7dae0">    Idle: improve tests → polish demo → rehearse. Do not poll uak next in a loop; wait for a message or a new task.</text><text class="l21" x="14" y="412" fill="#61afef">  human$ bash .uak/bin/board</text><text class="l22" x="14" y="429" fill="#d7dae0">    UAK BOARD · main@61b81e6 · 4 tasks · CLAIMED 2 · AVAILABLE 2 · freeze in 5h59m</text><text class="l23" x="14" y="446" fill="#d7dae0">    CLAIMED    HACK-001  ana-1      lease 44m    w1  Search API</text><text class="l24" x="14" y="463" fill="#d7dae0">    CLAIMED    HACK-002  bob-1      lease 44m    w1  Results UI</text><text class="l25" x="14" y="480" fill="#d7dae0">    AVAILABLE  HACK-003  P0         -            w2  Ranking</text><text class="l26" x="14" y="497" fill="#d7dae0">    AVAILABLE  HACK-004  P1         -            w1  API cache</text><text class="l27" x="14" y="514" fill="#e5c07b">▶ ana-1 fixes the failing API with a bounded loop (fake agent: no AI key needed)</text><text class="l28" x="14" y="531" fill="#61afef">  ana-1$ bash .uak/bin/uak loop --verify bash tests/api_test.sh --agent bash ~/demo/fake-agent.sh --max 5 --task HACK-</text><text class="l29" x="14" y="548" fill="#e06c75">    LOOP_FAIL iteration=1 exit=1 · expected 3 results, got: 0 results for pompe</text><text class="l30" x="14" y="565" fill="#e06c75">    LOOP_FAIL iteration=2 exit=1 · expected 3 results, got: 2 results for pompe</text><text class="l31" x="14" y="582" fill="#98c379">    LOOP_PASS iteration=3 · api ok</text><text class="l32" x="14" y="599" fill="#7f848e">    LOOP_SUMMARY 3 iteration(s) · 1 s · changed: 1 file changed, 1 insertion(+), 1 deletion(-) · log ~/demo/team/.git/</text><text class="l33" x="14" y="616" fill="#e5c07b">▶ ana-1 ships: push + PR + evidence → a reviewer is asked by rotation</text><text class="l34" x="14" y="633" fill="#61afef">  ana-1$ bash .uak/bin/uak done HACK-001 --pr https://github.com/example/demo/pull/1 --evidence bash tests/api_test.sh</text><text class="l35" x="14" y="650" fill="#98c379">    OK done HACK-001 | REVIEW | attempt 1</text><text class="l36" x="14" y="667" fill="#e5c07b">▶ bob-1 (not the author) reviews the exact SHA, then the gated merge queue integrates it</text><text class="l37" x="14" y="684" fill="#61afef">  bob-1$ bash .uak/bin/uak review HACK-001 --sha d334993 --verdict approve</text><text class="l38" x="14" y="701" fill="#98c379">    OK review HACK-001 | REVIEW | attempt 1</text><text class="l39" x="14" y="718" fill="#61afef">  ana-1$ bash .uak/bin/uak merge HACK-001</text><text class="l40" x="14" y="735" fill="#98c379">    OK merge HACK-001 | INTEGRATED | cba13d9 | review bob-1 | atomic claims+main</text><text class="l41" x="14" y="752" fill="#e5c07b">▶ The dependent task unlocks by itself</text><text class="l42" x="14" y="769" fill="#61afef">  cy-1$ bash .uak/bin/uak next</text><text class="l43" x="14" y="786" fill="#d7dae0">    HACK-003 | AVAILABLE | P0</text><text class="l44" x="14" y="803" fill="#7f848e">    Next: Implement HACK-003 and run: true</text><text class="l45" x="14" y="820" fill="#61afef">  cy-1$ bash .uak/bin/wt new HACK-003 --agent cy-1</text><text class="l46" x="14" y="837" fill="#98c379">    OK claim HACK-003 | CLAIMED | attempt 1</text><text class="l47" x="14" y="854" fill="#98c379">    WT_READY: HACK-003 · branch feat/hack-003 · worktree ~/demo/team-wt/hack-003</text><text class="l48" x="14" y="871" fill="#7f848e">    Next: cd &quot;~/demo/team-wt/hack-003&quot; and open your agent there (claude / codex / cursor).</text><text class="l49" x="14" y="888" fill="#e5c07b">▶ What the human sees: one board, one set of numbers</text><text class="l50" x="14" y="905" fill="#61afef">  human$ bash .uak/bin/board</text><text class="l51" x="14" y="922" fill="#d7dae0">    UAK BOARD · main@cba13d9 · 4 tasks · CLAIMED 2 · AVAILABLE 1 · INTEGRATED 1 · freeze in 5h59m</text><text class="l52" x="14" y="939" fill="#d7dae0">    CLAIMED    HACK-002  bob-1      lease 44m    w1  Results UI</text><text class="l53" x="14" y="956" fill="#d7dae0">    CLAIMED    HACK-003  cy-1       lease 44m    w2  Ranking</text><text class="l54" x="14" y="973" fill="#d7dae0">    AVAILABLE  HACK-004  P1         -            w1  API cache</text><text class="l55" x="14" y="990" fill="#98c379">    INTEGRATED HACK-001</text><text class="l56" x="14" y="1007" fill="#61afef">  human$ bash .uak/bin/stats</text><text class="l57" x="14" y="1024" fill="#d7dae0">    UAK STATS · claims commits 11</text><text class="l58" x="14" y="1041" fill="#d7dae0">    tasks: CLAIMED 2 · INTEGRATED 1</text><text class="l59" x="14" y="1058" fill="#d7dae0">    messages: 3</text><text class="l60" x="14" y="1075" fill="#d7dae0">    reviews: approve 1 · reject 0</text><text class="l61" x="14" y="1092" fill="#98c379">✓ Done: 3 agents, 1 conflict avoided, 1 bounded loop, 1 independent review, 1 gated merge.</text><text class="l62" x="14" y="1109" fill="#d7dae0">  Use it for real: bash install.sh --mode sprint &lt;your-repo&gt;</text></g></g></svg>
