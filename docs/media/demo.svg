<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.704%{opacity:0}1.741%,100%{opacity:1}}.l0{animation:l0 26.42s infinite}@keyframes l1{0%,5.868%{opacity:0}5.906%,100%{opacity:1}}.l1{animation:l1 26.42s infinite}@keyframes l2{0%,6.597%{opacity:0}6.635%,100%{opacity:1}}.l2{animation:l2 26.42s infinite}@keyframes l3{0%,6.825%{opacity:0}6.862%,100%{opacity:1}}.l3{animation:l3 26.42s infinite}@keyframes l4{0%,7.052%{opacity:0}7.090%,100%{opacity:1}}.l4{animation:l4 26.42s infinite}@keyframes l5{0%,7.279%{opacity:0}7.317%,100%{opacity:1}}.l5{animation:l5 26.42s infinite}@keyframes l6{0%,7.506%{opacity:0}7.544%,100%{opacity:1}}.l6{animation:l6 26.42s infinite}@keyframes l7{0%,11.300%{opacity:0}11.338%,100%{opacity:1}}.l7{animation:l7 26.42s infinite}@keyframes l8{0%,15.465%{opacity:0}15.502%,100%{opacity:1}}.l8{animation:l8 26.42s infinite}@keyframes l9{0%,15.692%{opacity:0}15.730%,100%{opacity:1}}.l9{animation:l9 26.42s infinite}@keyframes l10{0%,15.919%{opacity:0}15.957%,100%{opacity:1}}.l10{animation:l10 26.42s infinite}@keyframes l11{0%,16.146%{opacity:0}16.184%,100%{opacity:1}}.l11{animation:l11 26.42s infinite}@keyframes l12{0%,16.373%{opacity:0}16.411%,100%{opacity:1}}.l12{animation:l12 26.42s infinite}@keyframes l13{0%,16.600%{opacity:0}16.638%,100%{opacity:1}}.l13{animation:l13 26.42s infinite}@keyframes l14{0%,16.827%{opacity:0}16.865%,100%{opacity:1}}.l14{animation:l14 26.42s infinite}@keyframes l15{0%,17.054%{opacity:0}17.092%,100%{opacity:1}}.l15{animation:l15 26.42s infinite}@keyframes l16{0%,20.850%{opacity:0}20.888%,100%{opacity:1}}.l16{animation:l16 26.42s infinite}@keyframes l17{0%,24.554%{opacity:0}24.591%,100%{opacity:1}}.l17{animation:l17 26.42s infinite}@keyframes l18{0%,24.781%{opacity:0}24.819%,1