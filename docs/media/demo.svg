<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.731%{opacity:0}1.769%,100%{opacity:1}}.l0{animation:l0 26.00s infinite}@keyframes l1{0%,5.962%{opacity:0}6.001%,100%{opacity:1}}.l1{animation:l1 26.00s infinite}@keyframes l2{0%,6.490%{opacity:0}6.528%,100%{opacity:1}}.l2{animation:l2 26.00s infinite}@keyframes l3{0%,6.721%{opacity:0}6.759%,100%{opacity:1}}.l3{animation:l3 26.00s infinite}@keyframes l4{0%,6.952%{opacity:0}6.990%,100%{opacity:1}}.l4{animation:l4 26.00s infinite}@keyframes l5{0%,7.182%{opacity:0}7.221%,100%{opacity:1}}.l5{animation:l5 26.00s infinite}@keyframes l6{0%,7.413%{opacity:0}7.452%,100%{opacity:1}}.l6{animation:l6 26.00s infinite}@keyframes l7{0%,11.269%{opacity:0}11.308%,100%{opacity:1}}.l7{animation:l7 26.00s infinite}@keyframes l8{0%,15.500%{opacity:0}15.539%,100%{opacity:1}}.l8{animation:l8 26.00s infinite}@keyframes l9{0%,15.731%{opacity:0}15.770%,100%{opacity:1}}.l9{animation:l9 26.00s infinite}@keyframes l10{0%,15.962%{opacity:0}16.000%,100%{opacity:1}}.l10{animation:l10 26.00s infinite}@keyframes l11{0%,16.193%{opacity:0}16.231%,100%{opacity:1}}.l11{animation:l11 26.00s infinite}@keyframes l12{0%,16.423%{opacity:0}16.462%,100%{opacity:1}}.l12{animation:l12 26.00s infinite}@keyframes l13{0%,16.654%{opacity:0}16.693%,100%{opacity:1}}.l13{animation:l13 26.00s infinite}@keyframes l14{0%,16.885%{opacity:0}16.924%,100%{opacity:1}}.l14{animation:l14 26.00s infinite}@keyframes l15{0%,17.116%{opacity:0}17.154%,100%{opacity:1}}.l15{animation:l15 26.00s infinite}@keyframes l16{0%,20.972%{opacity:0}21.010%,100%{opacity:1}}.l16{animation:l16 26.00s infinite}@keyframes l17{0%,24.535%{opacity:0}24.573%,100%{opacity:1}}.l17{animation:l17 26.00s infinite}@keyframes l18{0%,24.766%{opacity:0}24.804%,1