<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.697%{opacity:0}1.735%,100%{opacity:1}}.l0{animation:l0 26.51s infinite}@keyframes l1{0%,5.846%{opacity:0}5.884%,100%{opacity:1}}.l1{animation:l1 26.51s infinite}@keyframes l2{0%,6.664%{opacity:0}6.701%,100%{opacity:1}}.l2{animation:l2 26.51s infinite}@keyframes l3{0%,6.890%{opacity:0}6.928%,100%{opacity:1}}.l3{animation:l3 26.51s infinite}@keyframes l4{0%,7.116%{opacity:0}7.154%,100%{opacity:1}}.l4{animation:l4 26.51s infinite}@keyframes l5{0%,7.343%{opacity:0}7.380%,100%{opacity:1}}.l5{animation:l5 26.51s infinite}@keyframes l6{0%,7.569%{opacity:0}7.607%,100%{opacity:1}}.l6{animation:l6 26.51s infinite}@keyframes l7{0%,11.349%{opacity:0}11.387%,100%{opacity:1}}.l7{animation:l7 26.51s infinite}@keyframes l8{0%,15.498%{opacity:0}15.536%,100%{opacity:1}}.l8{animation:l8 26.51s infinite}@keyframes l9{0%,15.724%{opacity:0}15.762%,100%{opacity:1}}.l9{animation:l9 26.51s infinite}@keyframes l10{0%,15.951%{opacity:0}15.988%,100%{opacity:1}}.l10{animation:l10 26.51s infinite}@keyframes l11{0%,16.177%{opacity:0}16.215%,100%{opacity:1}}.l11{animation:l11 26.51s infinite}@keyframes l12{0%,16.403%{opacity:0}16.441%,100%{opacity:1}}.l12{animation:l12 26.51s infinite}@keyframes l13{0%,16.630%{opacity:0}16.667%,100%{opacity:1}}.l13{animation:l13 26.51s infinite}@keyframes l14{0%,16.856%{opacity:0}16.894%,100%{opacity:1}}.l14{animation:l14 26.51s infinite}@keyframes l15{0%,17.082%{opacity:0}17.120%,100%{opacity:1}}.l15{animation:l15 26.51s infinite}@keyframes l16{0%,20.861%{opacity:0}20.899%,100%{opacity:1}}.l16{animation:l16 26.51s infinite}@keyframes l17{0%,24.692%{opacity:0}24.730%,100%{opacity:1}}.l17{animation:l17 26.51s infinite}@keyframes l18{0%,24.918%{opacity:0}24.956%,1