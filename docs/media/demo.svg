<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.747%{opacity:0}1.786%,100%{opacity:1}}.l0{animation:l0 25.76s infinite}@keyframes l1{0%,6.017%{opacity:0}6.055%,100%{opacity:1}}.l1{animation:l1 25.76s infinite}@keyframes l2{0%,6.536%{opacity:0}6.575%,100%{opacity:1}}.l2{animation:l2 25.76s infinite}@keyframes l3{0%,6.769%{opacity:0}6.807%,100%{opacity:1}}.l3{animation:l3 25.76s infinite}@keyframes l4{0%,7.002%{opacity:0}7.040%,100%{opacity:1}}.l4{animation:l4 25.76s infinite}@keyframes l5{0%,7.234%{opacity:0}7.273%,100%{opacity:1}}.l5{animation:l5 25.76s infinite}@keyframes l6{0%,7.467%{opacity:0}7.506%,100%{opacity:1}}.l6{animation:l6 25.76s infinite}@keyframes l7{0%,11.356%{opacity:0}11.394%,100%{opacity:1}}.l7{animation:l7 25.76s infinite}@keyframes l8{0%,15.626%{opacity:0}15.664%,100%{opacity:1}}.l8{animation:l8 25.76s infinite}@keyframes l9{0%,15.858%{opacity:0}15.897%,100%{opacity:1}}.l9{animation:l9 25.76s infinite}@keyframes l10{0%,16.091%{opacity:0}16.130%,100%{opacity:1}}.l10{animation:l10 25.76s infinite}@keyframes l11{0%,16.324%{opacity:0}16.363%,100%{opacity:1}}.l11{animation:l11 25.76s infinite}@keyframes l12{0%,16.557%{opacity:0}16.596%,100%{opacity:1}}.l12{animation:l12 25.76s infinite}@keyframes l13{0%,16.790%{opacity:0}16.829%,100%{opacity:1}}.l13{animation:l13 25.76s infinite}@keyframes l14{0%,17.023%{opacity:0}17.062%,100%{opacity:1}}.l14{animation:l14 25.76s infinite}@keyframes l15{0%,17.256%{opacity:0}17.295%,100%{opacity:1}}.l15{animation:l15 25.76s infinite}@keyframes l16{0%,21.146%{opacity:0}21.185%,100%{opacity:1}}.l16{animation:l16 25.76s infinite}@keyframes l17{0%,25.097%{opacity:0}25.136%,100%{opacity:1}}.l17{animation:l17 25.76s infinite}@keyframes l18{0%,25.330%{opacity:0}25.369%,1