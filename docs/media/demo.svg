<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.761%{opacity:0}1.800%,100%{opacity:1}}.l0{animation:l0 25.55s infinite}@keyframes l1{0%,6.066%{opacity:0}6.105%,100%{opacity:1}}.l1{animation:l1 25.55s infinite}@keyframes l2{0%,6.558%{opacity:0}6.597%,100%{opacity:1}}.l2{animation:l2 25.55s infinite}@keyframes l3{0%,6.793%{opacity:0}6.832%,100%{opacity:1}}.l3{animation:l3 25.55s infinite}@keyframes l4{0%,7.028%{opacity:0}7.067%,100%{opacity:1}}.l4{animation:l4 25.55s infinite}@keyframes l5{0%,7.263%{opacity:0}7.302%,100%{opacity:1}}.l5{animation:l5 25.55s infinite}@keyframes l6{0%,7.498%{opacity:0}7.537%,100%{opacity:1}}.l6{animation:l6 25.55s infinite}@keyframes l7{0%,11.420%{opacity:0}11.459%,100%{opacity:1}}.l7{animation:l7 25.55s infinite}@keyframes l8{0%,15.725%{opacity:0}15.764%,100%{opacity:1}}.l8{animation:l8 25.55s infinite}@keyframes l9{0%,15.959%{opacity:0}15.999%,100%{opacity:1}}.l9{animation:l9 25.55s infinite}@keyframes l10{0%,16.194%{opacity:0}16.233%,100%{opacity:1}}.l10{animation:l10 25.55s infinite}@keyframes l11{0%,16.429%{opacity:0}16.468%,100%{opacity:1}}.l11{animation:l11 25.55s infinite}@keyframes l12{0%,16.664%{opacity:0}16.703%,100%{opacity:1}}.l12{animation:l12 25.55s infinite}@keyframes l13{0%,16.899%{opacity:0}16.938%,100%{opacity:1}}.l13{animation:l13 25.55s infinite}@keyframes l14{0%,17.133%{opacity:0}17.173%,100%{opacity:1}}.l14{animation:l14 25.55s infinite}@keyframes l15{0%,17.368%{opacity:0}17.407%,100%{opacity:1}}.l15{animation:l15 25.55s infinite}@keyframes l16{0%,21.291%{opacity:0}21.330%,100%{opacity:1}}.l16{animation:l16 25.55s infinite}@keyframes l17{0%,25.143%{opacity:0}25.182%,100%{opacity:1}}.l17{animation:l17 25.55s infinite}@keyframes l18{0%,25.378%{opacity:0}25.417%,1