<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.690%{opacity:0}1.727%,100%{opacity:1}}.l0{animation:l0 26.63s infinite}@keyframes l1{0%,5.820%{opacity:0}5.858%,100%{opacity:1}}.l1{animation:l1 26.63s infinite}@keyframes l2{0%,6.422%{opacity:0}6.460%,100%{opacity:1}}.l2{animation:l2 26.63s infinite}@keyframes l3{0%,6.648%{opacity:0}6.685%,100%{opacity:1}}.l3{animation:l3 26.63s infinite}@keyframes l4{0%,6.873%{opacity:0}6.910%,100%{opacity:1}}.l4{animation:l4 26.63s infinite}@keyframes l5{0%,7.098%{opacity:0}7.136%,100%{opacity:1}}.l5{animation:l5 26.63s infinite}@keyframes l6{0%,7.323%{opacity:0}7.361%,100%{opacity:1}}.l6{animation:l6 26.63s infinite}@keyframes l7{0%,11.086%{opacity:0}11.123%,100%{opacity:1}}.l7{animation:l7 26.63s infinite}@keyframes l8{0%,15.216%{opacity:0}15.254%,100%{opacity:1}}.l8{animation:l8 26.63s infinite}@keyframes l9{0%,15.442%{opacity:0}15.479%,100%{opacity:1}}.l9{animation:l9 26.63s infinite}@keyframes l10{0%,15.667%{opacity:0}15.705%,100%{opacity:1}}.l10{animation:l10 26.63s infinite}@keyframes l11{0%,15.892%{opacity:0}15.930%,100%{opacity:1}}.l11{animation:l11 26.63s infinite}@keyframes l12{0%,16.118%{opacity:0}16.155%,100%{opacity:1}}.l12{animation:l12 26.63s infinite}@keyframes l13{0%,16.343%{opacity:0}16.380%,100%{opacity:1}}.l13{animation:l13 26.63s infinite}@keyframes l14{0%,16.568%{opacity:0}16.606%,100%{opacity:1}}.l14{animation:l14 26.63s infinite}@keyframes l15{0%,16.794%{opacity:0}16.831%,100%{opacity:1}}.l15{animation:l15 26.63s infinite}@keyframes l16{0%,20.554%{opacity:0}20.592%,100%{opacity:1}}.l16{animation:l16 26.63s infinite}@keyframes l17{0%,24.685%{opacity:0}24.723%,100%{opacity:1}}.l17{animation:l17 26.63s infinite}@keyframes l18{0%,24.910%{opacity:0}24.948%,1