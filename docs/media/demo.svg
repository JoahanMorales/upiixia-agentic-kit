<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.702%{opacity:0}1.740%,100%{opacity:1}}.l0{animation:l0 26.44s infinite}@keyframes l1{0%,5.863%{opacity:0}5.901%,100%{opacity:1}}.l1{animation:l1 26.44s infinite}@keyframes l2{0%,6.423%{opacity:0}6.461%,100%{opacity:1}}.l2{animation:l2 26.44s infinite}@keyframes l3{0%,6.650%{opacity:0}6.688%,100%{opacity:1}}.l3{animation:l3 26.44s infinite}@keyframes l4{0%,6.877%{opacity:0}6.915%,100%{opacity:1}}.l4{animation:l4 26.44s infinite}@keyframes l5{0%,7.104%{opacity:0}7.142%,100%{opacity:1}}.l5{animation:l5 26.44s infinite}@keyframes l6{0%,7.331%{opacity:0}7.369%,100%{opacity:1}}.l6{animation:l6 26.44s infinite}@keyframes l7{0%,11.122%{opacity:0}11.160%,100%{opacity:1}}.l7{animation:l7 26.44s infinite}@keyframes l8{0%,15.283%{opacity:0}15.321%,100%{opacity:1}}.l8{animation:l8 26.44s infinite}@keyframes l9{0%,15.510%{opacity:0}15.548%,100%{opacity:1}}.l9{animation:l9 26.44s infinite}@keyframes l10{0%,15.737%{opacity:0}15.775%,100%{opacity:1}}.l10{animation:l10 26.44s infinite}@keyframes l11{0%,15.964%{opacity:0}16.002%,100%{opacity:1}}.l11{animation:l11 26.44s infinite}@keyframes l12{0%,16.191%{opacity:0}16.228%,100%{opacity:1}}.l12{animation:l12 26.44s infinite}@keyframes l13{0%,16.418%{opacity:0}16.455%,100%{opacity:1}}.l13{animation:l13 26.44s infinite}@keyframes l14{0%,16.645%{opacity:0}16.682%,100%{opacity:1}}.l14{animation:l14 26.44s infinite}@keyframes l15{0%,16.872%{opacity:0}16.909%,100%{opacity:1}}.l15{animation:l15 26.44s infinite}@keyframes l16{0%,20.663%{opacity:0}20.701%,100%{opacity:1}}.l16{animation:l16 26.44s infinite}@keyframes l17{0%,24.824%{opacity:0}24.862%,100%{opacity:1}}.l17{animation:l17 26.44s infinite}@keyframes l18{0%,25.051%{opacity:0}25.089%,1