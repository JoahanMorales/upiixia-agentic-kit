<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.711%{opacity:0}1.749%,100%{opacity:1}}.l0{animation:l0 26.30s infinite}@keyframes l1{0%,5.894%{opacity:0}5.932%,100%{opacity:1}}.l1{animation:l1 26.30s infinite}@keyframes l2{0%,6.461%{opacity:0}6.499%,100%{opacity:1}}.l2{animation:l2 26.30s infinite}@keyframes l3{0%,6.689%{opacity:0}6.727%,100%{opacity:1}}.l3{animation:l3 26.30s infinite}@keyframes l4{0%,6.917%{opacity:0}6.955%,100%{opacity:1}}.l4{animation:l4 26.30s infinite}@keyframes l5{0%,7.145%{opacity:0}7.183%,100%{opacity:1}}.l5{animation:l5 26.30s infinite}@keyframes l6{0%,7.373%{opacity:0}7.411%,100%{opacity:1}}.l6{animation:l6 26.30s infinite}@keyframes l7{0%,11.183%{opacity:0}11.221%,100%{opacity:1}}.l7{animation:l7 26.30s infinite}@keyframes l8{0%,15.366%{opacity:0}15.404%,100%{opacity:1}}.l8{animation:l8 26.30s infinite}@keyframes l9{0%,15.594%{opacity:0}15.632%,100%{opacity:1}}.l9{animation:l9 26.30s infinite}@keyframes l10{0%,15.822%{opacity:0}15.860%,100%{opacity:1}}.l10{animation:l10 26.30s infinite}@keyframes l11{0%,16.050%{opacity:0}16.088%,100%{opacity:1}}.l11{animation:l11 26.30s infinite}@keyframes l12{0%,16.279%{opacity:0}16.317%,100%{opacity:1}}.l12{animation:l12 26.30s infinite}@keyframes l13{0%,16.507%{opacity:0}16.545%,100%{opacity:1}}.l13{animation:l13 26.30s infinite}@keyframes l14{0%,16.735%{opacity:0}16.773%,100%{opacity:1}}.l14{animation:l14 26.30s infinite}@keyframes l15{0%,16.963%{opacity:0}17.001%,100%{opacity:1}}.l15{animation:l15 26.30s infinite}@keyframes l16{0%,20.775%{opacity:0}20.813%,100%{opacity:1}}.l16{animation:l16 26.30s infinite}@keyframes l17{0%,24.934%{opacity:0}24.972%,100%{opacity:1}}.l17{animation:l17 26.30s infinite}@keyframes l18{0%,25.163%{opacity:0}25.201%,1