<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.626%{opacity:0}1.662%,100%{opacity:1}}.l0{animation:l0 27.67s infinite}@keyframes l1{0%,5.602%{opacity:0}5.638%,100%{opacity:1}}.l1{animation:l1 27.67s infinite}@keyframes l2{0%,6.169%{opacity:0}6.205%,100%{opacity:1}}.l2{animation:l2 27.67s infinite}@keyframes l3{0%,6.385%{opacity:0}6.421%,100%{opacity:1}}.l3{animation:l3 27.67s infinite}@keyframes l4{0%,6.602%{opacity:0}6.638%,100%{opacity:1}}.l4{animation:l4 27.67s infinite}@keyframes l5{0%,6.819%{opacity:0}6.855%,100%{opacity:1}}.l5{animation:l5 27.67s infinite}@keyframes l6{0%,7.036%{opacity:0}7.072%,100%{opacity:1}}.l6{animation:l6 27.67s infinite}@keyframes l7{0%,10.657%{opacity:0}10.693%,100%{opacity:1}}.l7{animation:l7 27.67s infinite}@keyframes l8{0%,14.633%{opacity:0}14.669%,100%{opacity:1}}.l8{animation:l8 27.67s infinite}@keyframes l9{0%,14.850%{opacity:0}14.886%,100%{opacity:1}}.l9{animation:l9 27.67s infinite}@keyframes l10{0%,15.066%{opacity:0}15.103%,100%{opacity:1}}.l10{animation:l10 27.67s infinite}@keyframes l11{0%,15.283%{opacity:0}15.319%,100%{opacity:1}}.l11{animation:l11 27.67s infinite}@keyframes l12{0%,15.500%{opacity:0}15.536%,100%{opacity:1}}.l12{animation:l12 27.67s infinite}@keyframes l13{0%,15.717%{opacity:0}15.753%,100%{opacity:1}}.l13{animation:l13 27.67s infinite}@keyframes l14{0%,15.934%{opacity:0}15.970%,100%{opacity:1}}.l14{animation:l14 27.67s infinite}@keyframes l15{0%,16.151%{opacity:0}16.187%,100%{opacity:1}}.l15{animation:l15 27.67s infinite}@keyframes l16{0%,19.772%{opacity:0}19.808%,100%{opacity:1}}.l16{animation:l16 27.67s infinite}@keyframes l17{0%,23.748%{opacity:0}23.784%,100%{opacity:1}}.l17{animation:l17 27.67s infinite}@keyframes l18{0%,23.965%{opacity:0}24.001%,1