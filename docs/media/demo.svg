<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.739%{opacity:0}1.778%,100%{opacity:1}}.l0{animation:l0 25.87s infinite}@keyframes l1{0%,5.991%{opacity:0}6.030%,100%{opacity:1}}.l1{animation:l1 25.87s infinite}@keyframes l2{0%,6.513%{opacity:0}6.551%,100%{opacity:1}}.l2{animation:l2 25.87s infinite}@keyframes l3{0%,6.745%{opacity:0}6.783%,100%{opacity:1}}.l3{animation:l3 25.87s infinite}@keyframes l4{0%,6.977%{opacity:0}7.015%,100%{opacity:1}}.l4{animation:l4 25.87s infinite}@keyframes l5{0%,7.208%{opacity:0}7.247%,100%{opacity:1}}.l5{animation:l5 25.87s infinite}@keyframes l6{0%,7.440%{opacity:0}7.479%,100%{opacity:1}}.l6{animation:l6 25.87s infinite}@keyframes l7{0%,11.312%{opacity:0}11.351%,100%{opacity:1}}.l7{animation:l7 25.87s infinite}@keyframes l8{0%,15.564%{opacity:0}15.602%,100%{opacity:1}}.l8{animation:l8 25.87s infinite}@keyframes l9{0%,15.796%{opacity:0}15.834%,100%{opacity:1}}.l9{animation:l9 25.87s infinite}@keyframes l10{0%,16.027%{opacity:0}16.066%,100%{opacity:1}}.l10{animation:l10 25.87s infinite}@keyframes l11{0%,16.259%{opacity:0}16.298%,100%{opacity:1}}.l11{animation:l11 25.87s infinite}@keyframes l12{0%,16.491%{opacity:0}16.530%,100%{opacity:1}}.l12{animation:l12 25.87s infinite}@keyframes l13{0%,16.723%{opacity:0}16.762%,100%{opacity:1}}.l13{animation:l13 25.87s infinite}@keyframes l14{0%,16.955%{opacity:0}16.994%,100%{opacity:1}}.l14{animation:l14 25.87s infinite}@keyframes l15{0%,17.187%{opacity:0}17.226%,100%{opacity:1}}.l15{animation:l15 25.87s infinite}@keyframes l16{0%,21.060%{opacity:0}21.099%,100%{opacity:1}}.l16{animation:l16 25.87s infinite}@keyframes l17{0%,25.007%{opacity:0}25.046%,100%{opacity:1}}.l17{animation:l17 25.87s infinite}@keyframes l18{0%,25.239%{opacity:0}25.277%,1