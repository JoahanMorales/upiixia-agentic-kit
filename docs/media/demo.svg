<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.668%{opacity:0}1.705%,100%{opacity:1}}.l0{animation:l0 26.98s infinite}@keyframes l1{0%,5.746%{opacity:0}5.783%,100%{opacity:1}}.l1{animation:l1 26.98s infinite}@keyframes l2{0%,6.533%{opacity:0}6.571%,100%{opacity:1}}.l2{animation:l2 26.98s infinite}@keyframes l3{0%,6.756%{opacity:0}6.793%,100%{opacity:1}}.l3{animation:l3 26.98s infinite}@keyframes l4{0%,6.978%{opacity:0}7.015%,100%{opacity:1}}.l4{animation:l4 26.98s infinite}@keyframes l5{0%,7.201%{opacity:0}7.238%,100%{opacity:1}}.l5{animation:l5 26.98s infinite}@keyframes l6{0%,7.423%{opacity:0}7.460%,100%{opacity:1}}.l6{animation:l6 26.98s infinite}@keyframes l7{0%,11.140%{opacity:0}11.177%,100%{opacity:1}}.l7{animation:l7 26.98s infinite}@keyframes l8{0%,15.218%{opacity:0}15.255%,100%{opacity:1}}.l8{animation:l8 26.98s infinite}@keyframes l9{0%,15.440%{opacity:0}15.477%,100%{opacity:1}}.l9{animation:l9 26.98s infinite}@keyframes l10{0%,15.663%{opacity:0}15.700%,100%{opacity:1}}.l10{animation:l10 26.98s infinite}@keyframes l11{0%,15.885%{opacity:0}15.922%,100%{opacity:1}}.l11{animation:l11 26.98s infinite}@keyframes l12{0%,16.108%{opacity:0}16.145%,100%{opacity:1}}.l12{animation:l12 26.98s infinite}@keyframes l13{0%,16.330%{opacity:0}16.367%,100%{opacity:1}}.l13{animation:l13 26.98s infinite}@keyframes l14{0%,16.552%{opacity:0}16.589%,100%{opacity:1}}.l14{animation:l14 26.98s infinite}@keyframes l15{0%,16.775%{opacity:0}16.812%,100%{opacity:1}}.l15{animation:l15 26.98s infinite}@keyframes l16{0%,20.492%{opacity:0}20.529%,100%{opacity:1}}.l16{animation:l16 26.98s infinite}@keyframes l17{0%,24.561%{opacity:0}24.599%,100%{opacity:1}}.l17{animation:l17 26.98s infinite}@keyframes l18{0%,24.784%{opacity:0}24.821%,1