y:1}}.l60{animation:l60 26.00s infinite}@keyframes l61{0%,77.253%{opacity:0}77.291%,100%{opacity:1}}.l61{animation:l61 26.00s infinite}@keyframes l62{0%,77.484%{opacity:0}77.522%,100%{opacity:1}}.l62{animation:l62 26.00s infinite}@keyframes l63{0%,77.715%{opacity:0}77.753%,100%{opacity:1}}.l63{animation:l63 26.00s infinite}@keyframes l64{0%,81.569%{opacity:0}81.608%,100%{opacity:1}}.l64{animation:l64 26.00s infinite}@keyframes l65{0%,82.004%{opacity:0}82.042%,100%{opacity:1}}.l65{animation:l65 26.00s infinite}@keyframes l66{0%,82.235%{opacity:0}82.273%,100%{opacity:1}}.l66{animation:l66 26.00s infinite}@keyframes l67{0%,82.465%{opacity:0}82.504%,100%{opacity:1}}.l67{animation:l67 26.00s infinite}@keyframes l68{0%,82.696%{opacity:0}82.735%,100%{opacity:1}}.l68{animation:l68 26.00s infinite}@keyframes l69{0%,82.927%{opacity:0}82.965%,100%{opacity:1}}.l69{animation:l69 26.00s infinite}@keyframes l70{0%,83.158%{opacity:0}83.196%,100%{opacity:1}}.l70{animation:l70 26.00s infinite}@keyframes l71{0%,83.421%{opacity:0}83.460%,100%{opacity:1}}.l71{animation:l71 26.00s infinite}@keyframes l72{0%,83.652%{opacity:0}83.691%,100%{opacity:1}}.l72{animation:l72 26.00s infinite}@keyframes l73{0%,83.883%{opacity:0}83.921%,100%{opacity:1}}.l73{animation:l73 26.00s infinite}@keyframes l74{0%,84.114%{opacity:0}84.152%,100%{opacity:1}}.l74{animation:l74 26.00s infinite}@keyframes l75{0%,84.345%{opacity:0}84.383%,100%{opacity:1}}.l75{animation:l75 26.00s infinite}@keyframes l76{0%,84.575%{opacity:0}84.614%,100%{opacity:1}}.l76{animation:l76 26.00s infinite}@keyframes scroll{0%{transform:translateY(0)}29.145%{transform:translateY(-17px)}29.376%{transform:translateY(-34px)}29.607%{transform:translateY(-51px)}31.871%{transform:translateY(-68px)}32.102%{transform:translateY(-85px)}32.333%{transform:translateY(-102px)}33.761%{transform:translateY(-119px)}33.992%{transform:translateY(-136px)}34.222%{transform:translateY(-153px)}34.453%{transform:translateY(-170px)}34.684%{transform:translateY(-187px)}35.030%{transform:translateY(-204px)}35.260%{transform:translateY(-221px)}35.491%{transform:translateY(-238px)}35.722%{transform:translateY(-255px)}35.953%{transform:translateY(-272px)}36.184%{transform:translateY(-289px)}40.040%{transform:translateY(-306px)}40.292%{transform:translateY(-323px)}44.159%{transform:translateY(-340px)}48.390%{transform:translateY(-357px)}48.621%{transform:translateY(-374px)}48.852%{transform:translateY(-391px)}49.082%{transform:translateY(-408px)}49.313%{transform:translateY(-425px)}53.544%{transform:translateY(-442px)}56.526%{transform:translateY(-459px)}56.757%{transform:translateY(-476px)}56.988%{transform:translateY(-493px)}60.843%{transform:translateY(-510px)}62.628%{transform:translateY(-527px)}62.859%{transform:translateY(-544px)}67.090%{transform:translateY(-561px)}67.321%{transform:translateY(-578px)}71.176%{transform:translateY(-595px)}72.628%{transform:translateY(-612px)}72.859%{transform:translateY(-629px)}73.090%{transform:translateY(-646px)}77.061%{transform:translateY(-663px)}77.291%{transform:translateY(-680px)}77.522%{transform:translateY(-697px)}77.753%{transform:translateY(-714px)}81.608%{transform:translateY(-731px)}82.042%{transform:translateY(-748px)}82.273%{transform:translateY(-765px)}82.504%{transform:translateY(-782px)}82.735%{transform:translateY(-799px)}82.965%{transform:translateY(-816px)}83.196%{transform:translateY(-833px)}83.460%{transform:translateY(-850px)}83.691%{transform:translateY(-867px)}83.921%{transform:translateY(-884px)}84.152%{transform:translateY(-901px)}84.383%{transform:translateY(-918px)}84.614%{transform:translateY(-935px)}100%{transform:translateY(-935px)}}.scroll{animation:scroll 26.00s steps(1,end) infinite}</style><rect width="100%" height="100%" rx="8" fill="#1e2127"/><circle cx="18" cy="14" r="5" fill="#e06c75"/><circle cx="36" cy="14" r="5" fill="#e5c07b"/><circle cx="54" cy="14" r="5" fill="#98c379"/><text x="438" y="18" fill="#7f848e" text-anchor="middle">bash .uak/bin/uak demo · real run, no AI key</text><clipPath id="c"><rect x="0" y="28" width="877" height="402"/></clipPath><g clip-path="url(#c)"><g class="scroll"><text class="l0" x="14" y="55" fill="#e5c07b">▶ A team repo with a backlog of 4 tasks (temp dir: ~/demo)</text><text class="l1" x="14" y="72" fill="#7f848e">SECRET_SCAN_PASS files=95 mode=staged</text><text class="l2" x="14" y="89" fill="#61afef">  planner$ bash .uak/bin/uak graph</text><text class="l3" x="14" y="106" fill="#d7dae0">    GRAPH 4 tasks · 2 waves · critical path 60 min: HACK-001 → HACK-003</text><text class="l4" x="14" y="123" fill="#d7dae0">    wave 1 (3): HACK-001 HACK-002 HACK-004</text><text class="l5" x="14" y="140" fill="#d7dae0">    wave 2 (1): HACK-003</text><text class="l6" x="14" y="157" fill="#e5c07b">▶ Minute 0: uak start checks every step from install to the first claim</text><text class="l7" x="14" y="174" fill="#61afef">  human$ bash .uak/bin/uak start</text><text class="l8" x="14" y="191" fill="#98c379">    OK    1. kit installed (sprint, uak 6.0.0)</text><text class="l9" x="14" y="208" fill="#98c379">    OK    2. remote origin reachable</text><text class="l10" x="14" y="225" fill="#98c379">    OK    3. preflight: doctor has no failures (4 warning(s): bash .uak/bin/doctor)</text><text class="l11" x="14" y="242" fill="#98c379">    OK    4. .uak/ on origin/main matches this checkout (uak 6.0.0)</text><text class="l12" x="14" y="259" fill="#98c379">    OK    5. plan: 4 task(s), lint clean</text><text class="l13" x="14" y="276" fill="#98c379">    OK    6. first task: HACK-001 (Search API)</text><text class="l14" x="14" y="293" fill="#d7dae0">    START READY · bash .uak/bin/wt new HACK-001   (branch + worktree + claim; then your agent in it)</text><text class="l15" x="14" y="310" fill="#e5c07b">▶ Three agents start at once — overlapping paths are rejected at claim time</text><text class="l16" x="14" y="327" fill="#61afef">  ana-1$ bash .uak/bin/wt new HACK-001 --agent ana-1</text><text class="l17" x="14" y="344" fill="#98c379">    OK claim HACK-001 | CLAIMED | attempt 1</text><text class="l18" x="14" y="361" fill="#98c379">    WT_READY: HACK-001 · branch feat/hack-001 · worktree ~/demo/team-wt/hack-001</text><text class="l19" x="14" y="378" fill="#7f848e">    Next: cd &quot;~/demo/team-wt/hack-001&quot; and open your agent there (claude / codex / cursor).</text><text class="l20" x="14" y="395" fill="#61afef">  bob-1$ bash .uak/bin/wt new HACK-002 --agent bob-1</text><text class="l21" x="14" y="412" fill="#98c379">    OK claim HACK-002 | CLAIMED | attempt 1</text><text class="l22" x="14" y="429" fill="#98c379">    WT_READY: HACK-002 · branch feat/hack-002 · worktree ~/demo/team-wt/hack-002</text><text class="l23" x="14" y="446" fill="#7f848e">    Next: cd &quot;~/demo/team-wt/hack-002&quot; and open your agent there (claude / codex / cursor).</text><text class="l24" x="14" y="463" fill="#61afef">  cy-1$ bash .uak/bin/wt new HACK-004 --agent cy-1</text><text class="l25" x="14" y="480" fill="#e06c75">    CONFLICT: HACK-004 overlaps HACK-001 (ana-1); pick another task, or wait once: uak wait HACK-001 --for integrated </text><text class="l26" x="14" y="497" fill="#98c379">  ✓ cy-1 cannot take HACK-004: it overlaps ana-1&#x27;s src/api.sh</text><text class="l27" x="14" y="514" fill="#61afef">  cy-1$ bash .uak/bin/uak next</text><text class="l28" x="14" y="531" fill="#d7dae0">    No eligible candidate (priority, dependencies, claims or authorization).</text><text class="l29" x="14" y="548" fill="#d7dae0">    Why not HACK-004: its Paths overlap HACK-001 of ana-1 (CLAIMED); it opens when that one merges.</text><text class="l30" x="14" y="565" fill="#d7dae0">    Waiting on dependencies: 1 task(s); HACK-003 waits on HACK-001 (CLAIMED).</text><text class="l31" x="14" y="582" fill="#d7dae0">    Idle: improve tests → polish demo → rehearse. Do not poll uak next in a loop; wait for a message or a new task.</text><text class="l32" x="14" y="599" fill="#61afef">  human$ bash .uak/bin/board</text><text class="l33" x="14" y="616" fill="#d7dae0">    UAK BOARD · main@4d89b2c · 4 tasks · CLAIMED 2 · AVAILABLE 2 · freeze in 5h59m</text><text class="l34" x="14" y="633" fill="#d7dae0">    CLAIMED    HACK-001  ana-1      lease 44m    w1  Search API</text><text class="l35" x="14" y="650" fill="#d7dae0">    CLAIMED    HACK-002  bob-1      lease 44m    w1  Results UI</text><text class="l36" x="14" y="667" fill="#d7dae0">    AVAILABLE  HACK-003  P0         -            w2  Ranking</text><text class="l37" x="14" y="684" fill="#d7dae0">    AVAILABLE  HACK-004  P1         -            w1  API cache</text><text class="l38" x="14" y="701" fill="#e5c07b">▶ ana-1 sees the test fail on its assertion before touching the code (test-first)</text><text class="l39" x="14" y="718" fill="#61afef">  ana-1$ bash .uak/bin/uak red HACK-001</text><text class="l40" x="14" y="735" fill="#e5c07b">▶ ana-1 fixes the failing API with a bounded loop (fake agent: no AI key needed)</text><text class="l41" x="14" y="752" fill="#61afef">  ana-1$ bash .uak/bin/uak loop --verify bash tests/api_test.sh --agent bash ~/demo/fake-agent.sh --max 5 --task HACK-</text><text class="l42" x="14" y="769" fill="#e06c75">    LOOP_FAIL iteration=1 exit=1 · expected: 3 results for pompe, got: 0 results for pompe</text><text class="l43" x="14" y="786" fill="#e06c75">    LOOP_FAIL iteration=2 exit=1 · expected: 3 results for pompe, got: 2 results for pompe</text><text class="l44" x="14" y="803" fill="#98c379">    LOOP_PASS iteration=3 · api ok</text><text class="l45" x="14" y="820" fill="#7f848e">    LOOP_SUMMARY 3 iteration(s) · 2 s · changed: 1 file changed, 1 insertion(+), 1 deletion(-) · log ~/demo/team/.git/</text><text class="l46" x="14" y="837" fill="#e5c07b">▶ ana-1 ships: push + PR + evidence → a reviewer is asked by rotation</text><text class="l47" x="14" y="854" fill="#61afef">  ana-1$ bash .uak/bin/uak done HACK-001 --pr https://github.com/example/demo/pull/1 --evidence bash tests/api_test.sh</text><text class="l48" x="14" y="871" fill="#98c379">    OK done HACK-001 | REVIEW | attempt 1</text><text class="l49" x="14" y="888" fill="#7f848e">    Next: bash .uak/bin/uak wait HACK-001 --for approve (one call; returns on approve or reject). Meanwhile: uak next </text><text class="l50" x="14" y="905" fill="#e5c07b">▶ bob-1 (not the author) reviews the exact SHA, then the gated merge queue integrates it</text><text class="l51" x="14" y="922" fill="#61afef">  bob-1$ bash .uak/bin/uak review HACK-001 --sha 7fae98b --verdict approve</text><text class="l52" x="14" y="939" fill="#98c379">    OK review HACK-001 | REVIEW | attempt 1</text><text class="l53" x="14" y="956" fill="#61afef">  ana-1$ bash .uak/bin/uak merge HACK-001</text><text class="l54" x="14" y="973" fill="#98c379">    OK merge HACK-001 | INTEGRATED | 6544777 | review bob-1 | atomic claims+main</text><text class="l55" x="14" y="990" fill="#e5c07b">▶ The dependent task unlocks by itself</text><text class="l56" x="14" y="1007" fill="#61afef">  cy-1$ bash .uak/bin/uak next</text><text class="l57" x="14" y="1024" fill="#d7dae0">    HACK-003 | AVAILABLE | P0</text><text class="l58" x="14" y="1041" fill="#7f848e">    Next: Write its tests, see them fail (uak red HACK-003), then implement until this passes: true</text><text class="l59" x="14" y="1058" fill="#61afef">  cy-1$ bash .uak/bin/wt new HACK-003 --agent cy-1</text><text class="l60" x="14" y="1075" fill="#98c379">    OK claim HACK-003 | CLAIMED | attempt 1</text><text class="l61" x="14" y="1092" fill="#98c379">    WT_READY: HACK-003 · branch feat/hack-003 · worktree ~/demo/team-wt/hack-003</text><text class="l62" x="14" y="1109" fill="#7f848e">    Next: cd &quot;~/demo/team-wt/hack-003&quot; and open your agent there (claude / codex / cursor).</text><text class="l63" x="14" y="1126" fill="#e5c07b">▶ What the human sees: one board, one set of numbers</text><text class="l64" x="14" y="1143" fill="#61afef">  human$ bash .uak/bin/board</text><text class="l65" x="14" y="1160" fill="#d7dae0">    UAK BOARD · main@6544777 · 4 tasks · CLAIMED 2 · AVAILABLE 1 · INTEGRATED 1 · freeze in 5h59m</text><text class="l66" x="14" y="1177" fill="#d7dae0">    CLAIMED    HACK-002  bob-1      lease 44m    w1  Results UI</text><text class="l67" x="14" y="1194" fill="#d7dae0">    CLAIMED    HACK-003  cy-1       lease 44m    w2  Ranking</text><text class="l68" x="14" y="1211" fill="#d7dae0">    AVAILABLE  HACK-004  P1         -            w1  API cache</text><text class="l69" x="14" y="1228" fill="#98c379">    INTEGRATED HACK-001</text><text class="l70" x="14" y="1245" fill="#61afef">  human$ bash .uak/bin/stats</text><text class="l71" x="14" y="1262" fill="#d7dae0">    UAK STATS · claims commits 12</text><text class="l72" x="14" y="1279" fill="#d7dae0">    tasks: CLAIMED 2 · INTEGRATED 1</text><text class="l73" x="14" y="1296" fill="#d7dae0">    messages: 3</text><text class="l74" x="14" y="1313" fill="#d7dae0">    reviews: approve 1 · reject 0</text><text class="l75" x="14" y="1330" fill="#98c379">✓ Done: 3 agents, 1 conflict avoided, 1 red before the code, 1 bounded loop, 1 independent review, 1 gated merge.</text><text class="l76" x="14" y="1347" fill="#d7dae0">  Use it for real: bash install.sh --mode sprint &lt;your-repo&gt;</text></g></g></svg>
