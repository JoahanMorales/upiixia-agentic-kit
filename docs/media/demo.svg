<svg xmlns="http://www.w3.org/2000/svg" width="877" height="430" viewBox="0 0 877 430" role="img" aria-label="uak demo: three agents claim, collide, loop, review and merge"><title>uak demo</title><style>text{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}@keyframes l0{0%,1.727%{opacity:0}1.765%,100%{opacity:1}}.l0{animation:l0 26.06s infinite}@keyframes l1{0%,5.947%{opacity:0}5.986%,100%{opacity:1}}.l1{animation:l1 26.06s infinite}@keyframes l2{0%,6.478%{opacity:0}6.516%,100%{opacity:1}}.l2{animation:l2 26.06s infinite}@keyframes l3{0%,6.708%{opacity:0}6.746%,100%{opacity:1}}.l3{animation:l3 26.06s infinite}@keyframes l4{0%,6.938%{opacity:0}6.977%,100%{opacity:1}}.l4{animation:l4 26.06s infinite}@keyframes l5{0%,7.168%{opacity:0}7.207%,100%{opacity:1}}.l5{animation:l5 26.06s infinite}@keyframes l6{0%,7.399%{opacity:0}7.437%,100%{opacity:1}}.l6{animation:l6 26.06s infinite}@keyframes l7{0%,11.245%{opacity:0}11.283%,100%{opacity:1}}.l7{animation:l7 26.06s infinite}@keyframes l8{0%,15.465%{opacity:0}15.504%,100%{opacity:1}}.l8{animation:l8 26.06s infinite}@keyframes l9{0%,15.696%{opacity:0}15.734%,100%{opacity:1}}.l9{animation:l9 26.06s infinite}@keyframes l10{0%,15.926%{opacity:0}15.964%,100%{opacity:1}}.l10{animation:l10 26.06s infinite}@keyframes l11{0%,16.156%{opacity:0}16.194%,100%{opacity:1}}.l11{animation:l11 26.06s infinite}@keyframes l12{0%,16.386%{opacity:0}16.425%,100%{opacity:1}}.l12{animation:l12 26.06s infinite}@keyframes l13{0%,16.616%{opacity:0}16.655%,100%{opacity:1}}.l13{animation:l13 26.06s infinite}@keyframes l14{0%,16.847%{opacity:0}16.885%,100%{opacity:1}}.l14{animation:l14 26.06s infinite}@keyframes l15{0%,17.077%{opacity:0}17.115%,100%{opacity:1}}.l15{animation:l15 26.06s infinite}@keyframes l16{0%,20.922%{opacity:0}20.961%,100%{opacity:1}}.l16{animation:l16 26.06s infinite}@keyframes l17{0%,24.522%{opacity:0}24.561%,100%{opacity:1}}.l17{animation:l17 26.06s infinite}@keyframes l18{0%,24.753%{opacity:0}24.791%,1