name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  discover:
    # The Windows matrix is every kit/.uak/tests/test_*.py: a new test file runs there with no edit here.
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: python3 scripts/kit_lint.py --ci-tests >> "$GITHUB_OUTPUT"
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60   # a hang fails in an hour, not six (a Windows job once hung 84 min)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # kit_hashes --check reads every kit version ever shipped
      - name: mawk too (Debian/Ubuntu default awk)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mawk && awk -W version | head -1
      - name: Git identity for fixtures
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Codex/Cursor/Gemini subagents are generated from .claude/agents
        run: python3 scripts/gen_harness.py --check
      - name: The kit's own rules as checks (portability, structure)
        run: python3 scripts/kit_lint.py
      - name: install --update recognizes every kit version ever shipped
        run: python3 scripts/kit_hashes.py --check
      - name: Protocol suite (real Git, local bare remotes)
        working-directory: kit
        # stdin held open, as in a terminal: a command that reads it (BSD awk -W version did) hangs here, not on a laptop
        run: |
          mkfifo "$RUNNER_TEMP/stdin"; sleep 7200 > "$RUNNER_TEMP/stdin" 2>/dev/null & holder=$!
          # Linux: temp paths with a space and an accent, like C:\Users\José Pérez
          if [ "$RUNNER_OS" = Linux ]; then export TMPDIR="$RUNNER_TEMP/José Pérez"; mkdir -p "$TMPDIR"; fi
          rc=0; bash .uak/bin/smoke --package-only < "$RUNNER_TEMP/stdin" || rc=$?
          kill "$holder"; exit "$rc"
      - name: MCP tools, one by one (tests/)
        run: python3 tests/test_mcp_tools.py
      - name: Installer
        run: |
          t=$(mktemp -d) && git -C "$t" init -q -b main && bash install.sh --mode marathon "$t" && test -f "$t/.uak/PROJECT.md"
  windows:
    # Git Bash, a CRLF checkout (core.autocrlf=true, as on a new Windows machine) and the MCP server started the way
    # Claude Code starts it. One job per test file (from the discover job): the Windows runner is slow at forking.
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.discover.outputs.tests) }}
    runs-on: windows-latest
    timeout-minutes: 30   # one test file per job: about 8 min for the longest
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for fixtures
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: ${{ matrix.t }}
        run: |
          if [ "${{ matrix.t }}" = mcp_tools ]; then exec python tests/test_mcp_tools.py; fi
          cd kit && python .uak/tests/${{ matrix.t }}.py --package "$PWD"
