name: test
# Once per commit: a branch with an open pull request ran everything on push and again on pull_request (audit v6.7 §1:
# about 200 checks per PR). Pull requests, then main and tags only.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
permissions:
  contents: read
jobs:
  discover:
    # The suite's shards (Linux, macOS) and the Windows shards split every kit/.uak/tests/test_*.py by measured seconds:
    # a new test file runs on the three systems with no edit here.
    runs-on: ubuntu-latest
    outputs:
      wshards: ${{ steps.list.outputs.wshards }}
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 scripts/kit_lint.py --ci-windows >> "$GITHUB_OUTPUT"
          python3 scripts/kit_lint.py --ci-shards 4 >> "$GITHUB_OUTPUT"
  suite:
    # 4 shards per OS, balanced by each file's measured seconds (UAK-018): one sequential macOS job took 15.6 min.
    # The checks that are not test files run once per OS, in shard 1.
    needs: discover
    name: suite (${{ matrix.os }}, ${{ matrix.shard.n }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60   # a hang fails in an hour, not six (a Windows job once hung 84 min)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # kit_hashes --check reads every kit version ever shipped
      - name: mawk too (Debian/Ubuntu default awk)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mawk && awk -W version | head -1
      - name: Git identity for fixtures
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Codex/Cursor/Gemini subagents are generated from .claude/agents
        if: matrix.shard.n == 1
        run: python3 scripts/gen_harness.py --check
      - name: The kit's own rules as checks (portability, structure)
        if: matrix.shard.n == 1
        run: python3 scripts/kit_lint.py
      - name: install --update recognizes every kit version ever shipped
        if: matrix.shard.n == 1
        run: python3 scripts/kit_hashes.py --check
      - name: Protocol suite (real Git, local bare remotes), this shard's files
        working-directory: kit
        env:
          SHARD_TESTS: ${{ matrix.shard.tests }}
        # stdin held open, as in a terminal: a command that reads it (BSD awk -W version did) hangs here, not on a laptop.
        # One smoke per file: a failing file is named in the job summary, and the rest of the shard still runs.
        run: |
          [ -n "$(echo $SHARD_TESTS)" ] || { echo "FAILED: this shard has no test files (empty SHARD_TESTS)"; exit 1; }
          mkfifo "$RUNNER_TEMP/stdin"; sleep 7200 > "$RUNNER_TEMP/stdin" 2>/dev/null & holder=$!
          # Linux: temp paths with a space and an accent, like C:\Users\José Pérez
          if [ "$RUNNER_OS" = Linux ]; then export TMPDIR="$RUNNER_TEMP/José Pérez"; mkdir -p "$TMPDIR"; fi
          failed=''
          for t in $SHARD_TESTS; do
            echo "::group::$t"
            UAK_SMOKE_TESTS=$t bash .uak/bin/smoke --package-only < "$RUNNER_TEMP/stdin" || failed="$failed $t"
            echo "::endgroup::"
          done
          kill "$holder"
          if [ -n "$failed" ]; then
            echo "### Failed test files (${{ matrix.os }}, shard ${{ matrix.shard.n }}):$failed" >> "$GITHUB_STEP_SUMMARY"
            echo "FAILED test files:$failed"; exit 1
          fi
      - name: MCP tools, one by one (tests/)
        if: matrix.shard.n == 1
        run: python3 tests/test_mcp_tools.py
      - name: Installer
        if: matrix.shard.n == 1
        run: |
          t=$(mktemp -d) && git -C "$t" init -q -b main && bash install.sh --mode marathon "$t" && test -f "$t/.uak/PROJECT.md"
  windows:
    # Git Bash, a CRLF checkout (core.autocrlf=true, as on a new Windows machine) and the MCP server started the way
    # Claude Code starts it. Shards from the discover job (kit_lint.py --ci-windows): the Windows runner is slow at
    # forking, so the count is the smallest that keeps the longest shard under 25 minutes. The MCP tools of tests/ are in
    # a shard as `mcp_tools`.
    needs: discover
    name: windows (${{ matrix.w.n }})
    strategy:
      fail-fast: false
      matrix:
        w: ${{ fromJSON(needs.discover.outputs.wshards) }}
    runs-on: windows-latest
    timeout-minutes: 45   # the bound is 25 minutes of tests; a hang fails here
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for fixtures
        run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: This shard's files
        env:
          SHARD_TESTS: ${{ matrix.w.tests }}
        run: |
          [ -n "$(echo $SHARD_TESTS)" ] || { echo "FAILED: this shard has no test files (empty SHARD_TESTS)"; exit 1; }
          failed=''
          for t in $SHARD_TESTS; do
            echo "::group::$t"
            if [ "$t" = mcp_tools ]; then python tests/test_mcp_tools.py || failed="$failed $t"
            else (cd kit && python ".uak/tests/$t.py" --package "$PWD") || failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "### Failed test files (windows, shard ${{ matrix.w.n }}):$failed" >> "$GITHUB_STEP_SUMMARY"
            echo "FAILED test files:$failed"; exit 1
          fi
