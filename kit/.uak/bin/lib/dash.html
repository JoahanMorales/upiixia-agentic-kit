<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Live view of a uak team: progress, agents, conversation and black box.">
<title>uak dash</title>
<link rel="icon" id="favicon" href="data:,">
<style>
/* Tokens. State colors come from a validated categorical set (light and dark stepped separately); the stacked bar
   keeps red away from yellow (integrated | review | claimed | available | blocked) so no adjacent pair is confusable. */
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --raised: #ffffff; --hover: #f0efea;
  --ink: #141413; --ink-2: #52514e; --muted: #898781; --line: #e6e5df; --line-2: #d4d3cc;
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-wash: #e6f0fc;
  --integrated: #1baf7a; --review: #2a78d6; --claimed: #eda100; --blocked: #e34948; --available: #c3c2b7; --cancelled: #d9d8d2;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --violet: #6250d6; --orange: #eb6834;
  --warn-wash: #fdf3dc; --warn-ink: #7a5300; --crit-wash: #fbe7e6; --crit-ink: #9e2525;
  --shadow: 0 1px 2px rgba(48, 44, 30, .05), 0 6px 20px -12px rgba(48, 44, 30, .18);
  --idc-bg-l: 93%; --idc-bg-s: 40%; --idc-px-l: 45%; --idc-px-s: 58%;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f0f0e; --surface: #1a1a19; --raised: #201f1e; --hover: #262624;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d86; --line: #2c2c2a; --line-2: #3a3a37;
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: #16273d;
    --integrated: #199e70; --review: #3987e5; --claimed: #c98500; --blocked: #e66767; --available: #5d5c57; --cancelled: #3f3f3c;
    --violet: #9085e9; --orange: #d95926;
    --warn-wash: #33280f; --warn-ink: #f5c766; --crit-wash: #3a1b1b; --crit-ink: #ffaaa6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -14px rgba(0, 0, 0, .6);
    --idc-bg-l: 21%; --idc-bg-s: 22%; --idc-px-l: 62%; --idc-px-s: 60%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f0e; --surface: #1a1a19; --raised: #201f1e; --hover: #262624;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d86; --line: #2c2c2a; --line-2: #3a3a37;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: #16273d;
  --integrated: #199e70; --review: #3987e5; --claimed: #c98500; --blocked: #e66767; --available: #5d5c57; --cancelled: #3f3f3c;
  --violet: #9085e9; --orange: #d95926;
  --warn-wash: #33280f; --warn-ink: #f5c766; --crit-wash: #3a1b1b; --crit-ink: #ffaaa6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -14px rgba(0, 0, 0, .6);
  --idc-bg-l: 21%; --idc-bg-s: 22%; --idc-px-l: 62%; --idc-px-s: 60%;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--raised); padding: 6px 10px; border-radius: 8px; z-index: 30; }
.skip:focus { left: 12px; }
.mono { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }

/* Top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 86%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.brand svg { flex: none; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 span { color: var(--muted); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.pill.stale { background: var(--warn-wash); border-color: transparent; color: var(--warn-ink); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: beat 2.4s ease-out infinite; }
.pill.stale .live { background: var(--warning); animation: none; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.theme { height: 28px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }

main { max-width: 1440px; margin: 0 auto; padding: 22px 24px 64px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin-bottom: 12px; }
.sec-h .muted { font-size: 12.5px; }

/* Overview */
.overview { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.progress { padding: 22px 24px 20px; display: flex; flex-direction: column; }
.pace { margin-top: auto; padding-top: 20px; }
.pace .sec-h { margin-bottom: 8px; }
.pace .cols { height: 52px; }
.pace .cols span { background: var(--integrated); }
.hero { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.hero .big { font-size: 64px; line-height: .9; font-weight: 700; letter-spacing: -.045em; }
.hero .big small { font-size: 28px; letter-spacing: -.02em; color: var(--ink-2); font-weight: 600; margin-left: 2px; }
.hero .cap { padding-bottom: 6px; color: var(--ink-2); max-width: 46ch; text-wrap: pretty; }
.hero .cap b { color: var(--ink); font-weight: 600; }
.stack { display: flex; gap: 2px; height: 12px; margin: 22px 0 14px; }
.stack span { display: block; height: 100%; min-width: 4px; border-radius: 3px; transition: opacity .2s; }
.stack:hover span { opacity: .55; } .stack span:hover { opacity: 1; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; }
.key { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.key b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tile { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease; min-width: 0; }
.tile:hover { border-color: var(--line-2); transform: translateY(-1px); }
.tile:active { transform: translateY(0) scale(.99); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile .lbl { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.tile .val { font-size: 30px; font-weight: 650; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .det { font-size: 12.5px; color: var(--muted); min-height: 22px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tile.hot .val { color: var(--crit-ink); }
.tile.warm .val { color: var(--warn-ink); }
.faces { display: flex; }
.faces > * { margin-right: -5px; box-shadow: 0 0 0 2px var(--surface); }

/* Attention */
.attention { margin-top: 16px; padding: 6px 8px; }
.att-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; }
.att-row + .att-row { border-top: 1px solid var(--line); }
.att-row .what { min-width: 0; }
.att-row .what div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-row .when { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--hover); color: var(--ink-2); flex: none; }
.ico.warn { background: var(--warn-wash); color: var(--warn-ink); } .ico.crit { background: var(--crit-wash); color: var(--crit-ink); } .ico.info { background: var(--accent-wash); color: var(--accent-ink); }
.ico svg { width: 15px; height: 15px; }
.allclear { display: flex; align-items: center; gap: 10px; padding: 10px; color: var(--ink-2); }

/* Tabs */
.tabs { display: flex; gap: 2px; margin: 30px 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { position: relative; border: 0; background: none; padding: 10px 12px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; border-radius: 8px 8px 0 0; transition: color .15s, background .15s; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { color: var(--ink); }
.tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--ink); }
.tabs .cnt { margin-left: 6px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Board */
.board { display: grid; gap: 14px; align-items: start; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px; font-weight: 600; font-size: 13px; }
.col-h .muted { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.col-empty { border: 1px dashed var(--line-2); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 12.5px; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-bottom: 10px; box-shadow: var(--shadow); transition: border-color .15s; }
.card:hover { border-color: var(--line-2); }
.card-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tid { all: unset; cursor: pointer; font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink); border-radius: 4px; }
.tid:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
.tid:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 6px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--hover); color: var(--ink-2); white-space: nowrap; }
.tag.warn { background: var(--warn-wash); color: var(--warn-ink); } .tag.crit { background: var(--crit-wash); color: var(--crit-ink); } .tag.info { background: var(--accent-wash); color: var(--accent-ink); }
.card .title { margin: 6px 0 10px; font-size: 13.5px; line-height: 1.42; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-f { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }
.card-f .pr { margin-left: auto; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; flex: none; }
.card-f .pr svg { width: 12px; height: 12px; }
.card-f .pr:hover { text-decoration: underline; }
.card .prog { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; font-size: 13px; }
.row + .row { border-top: 1px solid var(--line); }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.more { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: block; text-align: center; padding: 9px; font-size: 12.5px; color: var(--accent-ink); border-top: 1px solid var(--line); }
.more:hover { background: var(--hover); }
.who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Identicons: the 5x5 mirrored pattern comes from the human, the hue from the identity. */
svg.idc { flex: none; border-radius: 28%; display: block; }
svg.idc.human { border-radius: 50%; }
svg.idc .bg { fill: hsl(var(--h) var(--idc-bg-s) var(--idc-bg-l)); }
svg.idc .px { fill: hsl(var(--h) var(--idc-px-s) var(--idc-px-l)); }
.bot { flex: none; display: inline-grid; place-items: center; border-radius: 28%; background: var(--hover); color: var(--ink-2); font: 600 9px/1 var(--mono); text-transform: uppercase; }

/* Presence: shape and label, never color alone */
.pres { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.pres.online { background: var(--good); }
.pres.recent { background: var(--warning); }
.pres.away { box-shadow: inset 0 0 0 2px var(--violet); }
.pres.offline { box-shadow: inset 0 0 0 2px var(--available); }
.pres.retired { border: 1.5px dashed var(--available); }

/* Agents */
.group + .group { margin-top: 26px; }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.agent { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.agent .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.agent .st { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.agent .now { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; align-items: center; font-size: 12.5px; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--hover); font-size: 12px; color: var(--ink); }
.chip:hover { background: var(--line); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); padding-top: 10px; }
.stats div { font-size: 11.5px; color: var(--muted); }
.stats b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Conversation */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filters select, .filters input { height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); transition: border-color .15s; max-width: 100%; }
.filters select:hover, .filters input:hover { border-color: var(--line-2); }
.filters input { flex: 1 1 200px; min-width: 0; max-width: 340px; }
.filters .clear { all: unset; cursor: pointer; font-size: 12.5px; color: var(--accent-ink); padding: 4px 6px; border-radius: 6px; }
.filters .count { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.activity { padding: 16px 18px 12px; margin-bottom: 16px; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 84px; border-bottom: 1px solid var(--line-2); }
.cols span { flex: 1; min-width: 2px; background: var(--review); border-radius: 3px 3px 0 0; transition: opacity .15s; }
.cols:hover span { opacity: .5; } .cols span:hover { opacity: 1; }
.axis { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.thread { padding: 4px 18px; }
.day { position: relative; text-align: center; margin: 14px 0 4px; font-size: 12px; color: var(--muted); }
.day span { position: relative; background: var(--surface); padding: 0 10px; }
.day::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
.topic { display: flex; align-items: center; gap: 8px; padding: 14px 0 6px; font-size: 13px; color: var(--ink-2); }
.topic b { color: var(--ink); }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 12px 0; }
.msg + .msg { border-top: 1px solid var(--line); }
.msg .head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
.msg .head b { font-weight: 600; }
.msg .to { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.msg .meta { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kind { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.kind::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--kc, var(--available)); }
.msg .text { margin-top: 4px; color: var(--ink); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .text.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.sha { font-family: var(--mono); font-size: .9em; padding: 0 4px; border-radius: 4px; background: var(--hover); }
.expand { all: unset; cursor: pointer; margin-top: 4px; font-size: 12.5px; color: var(--accent-ink); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 2px; }

/* Black box, memory, tokens */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.box { padding: 18px 20px; min-width: 0; }
.hbars { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr) auto; gap: 7px 12px; align-items: center; font-size: 13px; }
.hbars .l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.hbars .b { display: block; height: 10px; border-radius: 0 3px 3px 0; background: var(--review); min-width: 3px; }
.hbars .v { font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 10px 8px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .nw { white-space: nowrap; }
.scroll { overflow-x: auto; }
.list-i { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 11px 0; }
.list-i + .list-i { border-top: 1px solid var(--line); }
.list-i .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.total { font-size: 44px; font-weight: 700; letter-spacing: -.04em; line-height: 1; margin: 10px 0 6px; }

#tip { position: fixed; left: 0; top: 0; z-index: 40; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px; padding: 6px 9px; border-radius: 7px; max-width: 280px; opacity: 0; transition: opacity .12s; }
#tip.on { opacity: 1; }

@media (max-width: 1000px) { .overview { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .top-in, main { padding-left: 16px; padding-right: 16px; }
  .brand { flex: 1 1 calc(100% - 110px); } .brand h1 span { display: none; }
  .theme { order: 1; } .pill { order: 2; }
  .tile .det { white-space: normal; }
  .hero .big { font-size: 52px; }
  .tiles { gap: 10px; } .tile { padding: 14px; } .tile .val { font-size: 26px; }
  .board { grid-template-columns: 1fr !important; }
  .msg .meta { margin-left: 0; width: 100%; }
  .thread, .box { padding-left: 14px; padding-right: 14px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top"><div class="top-in">
  <div class="brand"><span id="logo"></span><h1 id="repo">uak dash</h1></div>
  <span class="pill" id="fresh"><span class="live"></span><span id="freshtxt">loading…</span></span>

<script>

  function attention(d) {
