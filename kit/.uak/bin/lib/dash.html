<script>
/* uak-look:begin (the same script in setup.html and dash.html): theme and palette are the viewer's, kept in this browser only */
(function () {
  var PALS = [["clasico", "Clásico", 213, 71], ["lavanda", "Lavanda", 250, 72], ["cielo", "Cielo", 212, 72], ["menta", "Menta", 164, 55], ["salvia", "Salvia", 128, 28],

  function get() { return { theme: state.theme, pal: state.pal }; }
  function paint() {
    root.setAttribute("data-theme", state.theme === "auto" ? (dark && dark.matches ? "dark" : "light") : state.theme);
    root.setAttribute("data-pal", state.pal);

    var box = document.getElementById("look");
    if (!box) return;

    Array.prototype.forEach.call(box.querySelectorAll("[data-pal-set]"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-pal-set") === state.pal)); });
  }
  function tell() { listeners.forEach(function (f) { f(get()); }); }
  function set(change, keep) {
    if (change.theme !== undefined) state.theme = change.theme === "light" || change.theme === "dark" ? change.theme : "auto";
    if (known(change.pal)) state.pal = change.pal;

    tell();

  try { saved = JSON.parse(localStorage.getItem("uak-look") || "null") || { theme: localStorage.getItem("uak-dash-theme") }; } catch (e) {}

// The page's language before its first paint (UAK-165): the same choice workspace.js makes, read the same way; its words come with the page's script.
try { document.documentElement.lang = (localStorage.getItem("uak-language") || (/^es\b/i.test(navigator.language || "") ? "es" : "en")) === "es" ? "es" : "en"; } catch (e) {}

<style>
/* uak-system:begin (one design system: setup.html and dash.html carry this block byte for byte; test_setup_design.py compares them) */
@font-face { font-family: Inter; src: url(fonts/Inter.woff2) format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 100 800; font-style: normal; font-display: swap; }
/* Tokens. :root is Clasico, the exact colours of the dashboard of v6.8 (amber in progress, blue in review). The eight
   other palettes set one hue (--h) and one saturation (--sa); grounds, lines and inks are tinted from them. */
:root {
  color-scheme: light;
  --h: 212; --sa: 70%;
  --page: #f4f4f1; --surface: #fcfcfb; --raised: #ffffff; --hover: #f0efea;
  --ink: #141413; --ink-2: #52514e; --muted: #68665f; --line: #e6e5df; --line-2: #d4d3cc;
  --accent: #2a78d6; --accent-line: #2a78d6; --accent-ink: #1c5cab; --accent-wash: #e6f0fc;
  --btn: #1c5cab; --on-btn: #ffffff;
  --integrated: #1baf7a; --integrated-ink: #0f7a55; --integrated-wash: #e2f5ee;
  --claimed: #eda100; --claimed-ink: #7a5300; --claimed-wash: #fdf3dc;
  --review: #2a78d6; --review-ink: #1c5cab; --review-wash: #e6f0fc;
  --blocked: #e34948; --blocked-ink: #9e2525; --blocked-wash: #fbe7e6;
  --available: #c3c2b7; --waiting: #a99fe6; --cancelled: #d9d8d2;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --violet: #6250d6; --orange: #eb6834;
  --warn-wash: #fdf3dc; --warn-ink: #7a5300; --crit-wash: #fbe7e6; --crit-ink: #9e2525;
  --shadow: 0 12px 32px -12px hsl(0 0% 0% / .28); --scrim: hsl(0 0% 8% / .42); --on-node: #141413;
  --idc-bg-l: 93%; --idc-bg-s: 40%; --idc-px-l: 45%; --idc-px-s: 58%;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --r: 8px; --r-s: 6px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f0e; --surface: #1a1a19; --raised: #201f1e; --hover: #262624;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9c9a93; --line: #2c2c2a; --line-2: #3a3a37;
  --accent: #3987e5; --accent-line: #3987e5; --accent-ink: #86b6ef; --accent-wash: #16273d;
  --btn: #3987e5; --on-btn: #0f0f0e;
  --integrated: #199e70; --integrated-ink: #6fd3ac; --integrated-wash: #12281f;
  --claimed: #c98500; --claimed-ink: #f5c766; --claimed-wash: #33280f;
  --review: #3987e5; --review-ink: #86b6ef; --review-wash: #16273d;
  --blocked: #e66767; --blocked-ink: #ffaaa6; --blocked-wash: #3a1b1b;
  --available: #5d5c57; --waiting: #6b62b8; --cancelled: #3f3f3c;
  --violet: #9085e9; --orange: #d95926;
  --warn-wash: #33280f; --warn-ink: #f5c766; --crit-wash: #3a1b1b; --crit-ink: #ffaaa6;
  --shadow: 0 12px 32px -12px hsl(0 0% 0% / .6); --scrim: hsl(0 0% 0% / .6); --on-node: #0f0f0e;
  --idc-bg-l: 21%; --idc-bg-s: 22%; --idc-px-l: 62%; --idc-px-s: 60%;
}
[data-pal="lavanda"] { --h: 250; --sa: 72%; }
[data-pal="cielo"] { --h: 212; --sa: 72%; }
[data-pal="menta"] { --h: 164; --sa: 55%; }
[data-pal="salvia"] { --h: 128; --sa: 28%; }
[data-pal="durazno"] { --h: 22; --sa: 80%; }
[data-pal="rosa"] { --h: 338; --sa: 70%; }
[data-pal="arena"] { --h: 42; --sa: 45%; }
[data-pal="grafito"] { --h: 230; --sa: 0%; }
:root[data-pal]:not([data-pal="clasico"]) {
  --page: hsl(var(--h) 22% 97%); --surface: hsl(0 0% 100%); --raised: hsl(var(--h) 24% 98.5%); --hover: hsl(var(--h) 14% 93.5%);
  --ink: hsl(var(--h) 18% 13%); --ink-2: hsl(var(--h) 9% 31%); --muted: hsl(var(--h) 7% 40%); --line: hsl(var(--h) 16% 90%); --line-2: hsl(var(--h) 13% 82%);
  --accent: hsl(var(--h) var(--sa) 86%); --accent-line: hsl(var(--h) var(--sa) 68%); --accent-ink: hsl(var(--h) calc(var(--sa) * .65) 34%); --accent-wash: hsl(var(--h) var(--sa) 96%);
  --btn: hsl(var(--h) calc(var(--sa) * .8) 36%); --on-btn: hsl(0 0% 100%);
  --integrated: #a3dcbd; --integrated-ink: #2a7551; --integrated-wash: #e0f3e9;
  --claimed: #a9cdf3; --claimed-ink: #2c69ab; --claimed-wash: #e4eefa;
  --review: #ecd28c; --review-ink: #80600f; --review-wash: #faf0d4;
  --blocked: #f1b0a8; --blocked-ink: #a8463c; --blocked-wash: #fbe8e5;
  --available: hsl(var(--h) 10% 72%); --waiting: #c9c1f0; --cancelled: hsl(var(--h) 8% 86%);
  --good: #4fb883; --warning: #ecd28c; --critical: #e07f74;
  --warn-wash: #faf0d4; --warn-ink: #80600f; --crit-wash: #fbe8e5; --crit-ink: #a8463c;
}
:root[data-pal]:not([data-pal="clasico"])[data-theme="dark"] {
  --page: hsl(var(--h) 9% 6%); --surface: hsl(var(--h) 9% 10%); --raised: hsl(var(--h) 9% 13.5%); --hover: hsl(var(--h) 8% 15%);
  --ink: hsl(var(--h) 25% 96%); --ink-2: hsl(var(--h) 12% 78%); --muted: hsl(var(--h) 7% 62%); --line: hsl(var(--h) 8% 17.5%); --line-2: hsl(var(--h) 8% 27%);
  --accent: hsl(var(--h) var(--sa) 78%); --accent-line: hsl(var(--h) var(--sa) 74%); --accent-ink: hsl(var(--h) var(--sa) 82%); --accent-wash: hsl(var(--h) calc(var(--sa) * .5) 16%);
  --btn: hsl(var(--h) var(--sa) 78%); --on-btn: hsl(var(--h) 45% 12%);
  --integrated: #84d3a9; --integrated-ink: #94dcb6; --integrated-wash: #11291e;
  --claimed: #8fbff0; --claimed-ink: #9cc8f5; --claimed-wash: #13263a;
  --review: #e6c66a; --review-ink: #f0d27c; --review-wash: #2f2710;
  --blocked: #ee958a; --blocked-ink: #f5a79e; --blocked-wash: #361d19;
  --available: hsl(var(--h) 6% 40%); --waiting: #8a80cf; --cancelled: hsl(var(--h) 6% 26%);
  --good: #4fb883; --warning: #e6c66a; --critical: #ee958a;
  --warn-wash: #2f2710; --warn-ink: #f0d27c; --crit-wash: #361d19; --crit-ink: #f5a79e;
}
/* Menta and Salvia are green: integrated gets a deeper emerald so it never reads as the accent. */
:root[data-pal="menta"]:not([data-pal="clasico"]), :root[data-pal="salvia"]:not([data-pal="clasico"]) { --integrated: #2f9e5f; }
:root[data-pal="menta"]:not([data-pal="clasico"])[data-theme="dark"], :root[data-pal="salvia"]:not([data-pal="clasico"])[data-theme="dark"] { --integrated: #3dbb78; }
/* Parts both pages use: the pill, the line of nodes, the window, the single bordered list, the three figures, the
   buttons and the Apariencia control. */
*, ::before, ::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.pill { display: inline-flex; align-items: center; font: 600 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; white-space: nowrap; color: var(--muted); background: var(--hover); }
.p-prog { color: var(--claimed-ink); background: var(--claimed-wash); }
.p-rev { color: var(--review-ink); background: var(--review-wash); }
.p-int { color: var(--integrated-ink); background: var(--integrated-wash); }
.p-blk { color: var(--blocked-ink); background: var(--blocked-wash); }
.nodes { display: flex; align-items: center; list-style: none; margin: 0; padding: 0; }
.nodes li { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; color: var(--muted); }
.nodes li:last-child { flex: none; }
.nodes li::after { content: ""; flex: 1; min-width: 8px; height: 2px; background: var(--line-2); }
.nodes li:last-child::after { display: none; }
.nodes i { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--page); box-sizing: content-box; }
.nodes .on, .nodes .done { color: var(--ink-2); }
.nodes .on i, .nodes .done i, .nodes [aria-current] i { border-color: var(--accent-line); background: var(--accent-line); }
.nodes .on:not([aria-current])::after, .nodes .done:not([aria-current])::after { background: var(--accent-line); }
.nodes [aria-current] { color: var(--ink); font-weight: 600; }
.nodes [aria-current] i { box-shadow: 0 0 0 4px var(--accent-wash); }
.win { border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.win-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--raised); }
.win-h > i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.win-h > span { margin-left: 8px; font: 500 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.win-f { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.win-f > * { padding: 8px 12px; border-left: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.3; }
.win-f > :first-child { border-left: 0; }
.win-f b, .win-f strong { display: block; font-size: 16px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.list > * { padding: 8px 12px; border-top: 1px solid var(--line); }
.list > :first-child { border-top: 0; }
.ap { position: relative; margin: 0; padding: 0; border: 0; }
.ap summary { list-style: none; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 500; cursor: pointer; }
.ap summary::-webkit-details-marker { display: none; }
.ap summary i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-line); }
.ap .pop { position: absolute; right: 0; top: 32px; z-index: 60; width: 256px; padding: 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); }
.ap label, .ap .lbl { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.ap select { width: 100%; height: 32px; margin: 0 0 12px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--raised); }
.pals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pals button { display: grid; justify-items: center; gap: 4px; min-height: 52px; padding: 8px 0 4px; border: 1px solid var(--line); border-radius: var(--r-s); background: none; color: var(--ink-2); font-size: 11px; cursor: pointer; }
.pals button[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-wash); color: var(--ink); }
.pals i { width: 24px; height: 24px; border-radius: 50%; background: hsl(var(--h) var(--sa) 78%); box-shadow: inset 0 0 0 1px var(--line-2); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  .ap summary, .ap select, .pals button { min-height: 44px; }
  .ap .pop { position: fixed; left: 16px; right: 16px; top: auto; bottom: 16px; width: auto; }
}
/* uak-system:end */

html { scroll-behavior: smooth; }
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--raised); padding: 8px 12px; border-radius: var(--r); z-index: 30; }
.skip:focus { left: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 72px minmax(0,1fr); min-height: 100vh; }
.tabs { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 4px; padding: 16px 8px; background: var(--surface); border-right: 1px solid var(--line); z-index: 20; }
.tabs button { position: relative; display: grid; justify-items: center; align-content: center; gap: 4px; width: 56px; min-height: 56px; padding: 4px 0; border: 0; border-radius: var(--r); background: none; color: var(--ink-2); font-size: 11px; line-height: 1.2; text-align: center; }
.tabs button:hover { background: var(--hover); color: var(--ink); }
.tabs button.on { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.tabs .cnt { position: absolute; top: 2px; right: 4px; min-width: 16px; padding: 0 4px; border-radius: 999px; background: var(--blocked-wash); color: var(--blocked-ink); font: 600 11px/16px var(--mono); }
.tabs .ic { width: 20px; height: 20px; }
.main { min-width: 0; }
.head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.chip { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); font: 500 11px var(--mono); color: var(--ink-2); }
button.chip { cursor: pointer; border-radius: var(--r-s); }
button.chip:hover { background: var(--hover); }
.fresh { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; font-size: 12px; color: var(--muted); }
.fresh.stale { color: var(--warn-ink); background: var(--warn-wash); padding: 0 8px; border-radius: var(--r-s); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.fresh.stale .live { background: var(--warning); }
.lang { height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--ink-2); font-size: 12px; }
.page { display: grid; grid-template-columns: minmax(0,1fr) 296px; gap: 16px; align-items: start; max-width: 1360px; padding: 16px 24px 40px; }
.col { display: grid; gap: 16px; min-width: 0; }
.wide { max-width: 1360px; padding: 16px 24px 40px; }
.bh { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 32px; margin: 0 0 8px; }
.bh h2 { margin: 0; font-size: 13px; font-weight: 600; }
.bh .n { font: 500 11px var(--mono); color: var(--muted); }
.bh .x { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.pad { padding: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-s); overflow: hidden; }
.seg button { min-height: 28px; padding: 0 8px; border: 0; background: none; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.find { display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--muted); }
.find input { width: 220px; border: 0; background: none; outline: 0; font-size: 12px; color: var(--ink); }
.find:focus-within { outline: 2px solid var(--accent-line); outline-offset: 2px; }
.tmap { display: flex; flex-wrap: wrap; gap: 4px; }
.sq { all: unset; box-sizing: border-box; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; background: var(--c); color: var(--on-node); font: 600 11px var(--mono); cursor: pointer; }
.sq:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 2px; }
.sq.s-rev { box-shadow: inset 0 0 0 3px var(--surface),inset 0 0 0 4px var(--c); }
.sq.s-prog { background: var(--surface); border: 3px solid var(--c); color: var(--ink); }
.sq.s-blk { border-radius: 50%; }
.sq.s-av { background: var(--surface); border: 1px dashed var(--ink-2); color: var(--ink-2); }
.sq.s-wt { background: var(--hover); border: 1px solid var(--line-2); color: var(--ink-2); }
.sq.late { box-shadow: 0 0 0 2px var(--blocked); }
.sq.sm { width: 14px; height: 14px; font-size: 0; margin-right: 8px; vertical-align: -3px; }
.sq.sm.s-prog { border-width: 2px; }
.bbx summary { display: grid; grid-template-columns: auto auto minmax(0,1fr); gap: 8px; align-items: baseline; cursor: pointer; min-height: 28px; }
.bbx summary .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bbx details[open] summary .t { white-space: normal; }

.sw.g-task { background: var(--claimed); border-radius: 3px; width: 14px; height: 14px; } .sw.g-file { background: var(--available); transform: rotate(45deg) scale(.8); } .sw.g-agent { background: var(--violet); border-radius: 50%; }
.sq.dim { opacity: .3; }

.sq.sel { box-shadow: 0 0 0 2px var(--ink); }
.depline { margin: 12px 0 0; min-height: 20px; color: var(--ink-2); }

.dn2 { display: grid; grid-template-columns: auto auto; gap: 4px 8px; justify-content: start; align-items: center; min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--raised); text-align: left; }

dialog#share { margin: auto; padding: 0; width: min(560px,calc(100vw - 32px)); max-height: calc(100dvh - 24px); overflow: auto; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.scs { display: block; }

.acts:empty { display: none; }
.hold { margin: 8px 0 0; font-size: 13px; }
.sc b { display: block; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
.share-img { display: block; width: 100%; height: auto; border-radius: var(--r-s); border: 1px solid var(--line); -webkit-touch-callout: default; }
.share-img.v { width: auto; max-width: 100%; max-height: min(560px, calc(100dvh - 330px)); min-height: 200px; margin: 0 auto; }
.lb { position: relative; display: inline-block; }
.lbb { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 500; }
.lbb:hover { background: var(--hover); }
.lbb svg { width: 12px; height: 12px; }
.lbp { position: fixed; z-index: 70; margin: 0; padding: 4px; list-style: none; max-height: 280px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: var(--shadow); outline: none; }

.ac .chip { white-space: nowrap; }
.agrid.sm { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px; }
.agrid.sm .ac { padding: 8px; gap: 4px; }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.ac { display: grid; gap: 8px; align-content: start; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ac-h { display: flex; align-items: center; gap: 8px; min-width: 0; }

.ac .sub { margin: 0; }
.chip b { margin-left: 8px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ppl small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tid { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; min-height: 28px; cursor: pointer; font: 600 11px var(--mono); color: var(--ink-2); border-radius: 4px; }
.tid:hover { color: var(--accent-ink); text-decoration: underline; }

.more { all: unset; box-sizing: border-box; display: block; width: 100%; min-height: 32px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--accent-ink); cursor: pointer; }

.expand { all: unset; display: inline-flex; align-items: center; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--accent-ink); }
.filters .clear { all: unset; display: inline-flex; align-items: center; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--accent-ink); }
.tag { display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--hover); color: var(--ink-2); white-space: nowrap; }
.tag.warn { background: var(--warn-wash); color: var(--warn-ink); } .tag.crit { background: var(--crit-wash); color: var(--crit-ink); } .tag.info { background: var(--accent-wash); color: var(--accent-ink); }
/* What needs the person */

.need .hot { background: var(--crit-wash); }
.need .ico { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink-2); }
.need .hot .ico, .need .hot b { color: var(--crit-ink); }
.need b { font-weight: 600; margin-right: 8px; }
.need p { display: inline; margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.need .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
.cmd { display: flex; align-items: stretch; max-width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); overflow: hidden; }

.act { display: flex; align-items: center; gap: 12px; }
.list > .mre { display: block; padding: 0; }
.win-f.f4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
.win-f small { display: block; margin-top: 4px; overflow-wrap: anywhere; }
.win-f .warm b { color: var(--warn-ink); } .win-f .hot b { color: var(--crit-ink); }

.rows > li { display: grid; grid-template-columns: 96px 72px minmax(0,1fr) 112px minmax(0,164px); gap: 12px; align-items: center; }
.rows .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.rows .w { color: var(--muted); font-size: 12px; line-height: 1.3; text-align: right; overflow-wrap: anywhere; }
.rows .late .w { color: var(--crit-ink); font-weight: 600; }
.rows [data-story] { cursor: pointer; }

.pipe { min-width: 0; }
.pipe li { gap: 0; }

.mini { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; background: var(--line); }

.mini .more, .bcol .more { border-radius: var(--r-s); border: 1px solid var(--line); text-align: center; }

.lane > b { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.seg-b { position: absolute; top: 2px; height: 20px; min-width: 6px; border-radius: 4px; overflow: hidden; font: 600 11px/20px var(--mono); padding: 0 4px; color: var(--page); white-space: nowrap; background: var(--accent-line); }

.laxis { display: flex; justify-content: space-between; margin-left: 96px; font: 500 11px var(--mono); color: var(--muted); }
.legend span { white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0 12px 12px; font-size: 12px; color: var(--ink-2); }

.blocks i, .stack i { display: block; height: 12px; border-radius: 3px; background: var(--c); }

.stack { display: flex; gap: 2px; margin: 12px 0; }

.note { margin: 12px 0 0; color: var(--ink-2); }

.pr { margin-left: auto; font: 600 11px var(--mono); }
.gh { font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0 0; }
.dn { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 0 8px; padding: 8px 12px; font-size: 12px; cursor: pointer; }
.dn, .tk p, .mini .it p, .th .tt { overflow-wrap: anywhere; min-width: 0; }
.dn .t { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dn .t { line-height: 1.4; max-height: 2.8em; }
.dn small { grid-column: 2; padding-top: 2px; color: var(--muted); font-size: 11px; }
/* Lists inside tabs */
.row { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.row .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; }

.next { display: grid; gap: 12px; justify-items: start; padding: 24px; }

/* Arranging the summary: a dashed outline, the handles in place of the header, and a slow shake out of step (none under reduced motion). */
.arrbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; font-size: 12px; }
.arrbar p { margin: 0 auto 0 0; color: var(--muted); }
.arrbar.on { padding: 12px; border: 1px dashed var(--accent-line); border-radius: var(--r); background: var(--accent-wash); }
.arrbar.on .tip { color: var(--ink); font-weight: 600; }
.ab { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--ink); font: 500 12px var(--sans); }
.ab:hover { background: var(--hover); } .ab[disabled] { color: var(--muted); background: none; cursor: default; }
.ab.done { background: var(--ink); border-color: var(--ink); color: var(--page); }
.adds, .team { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.team .cmd { min-width: 0; } .team code { white-space: normal; overflow-wrap: anywhere; }
.addb { display: grid; gap: 4px; max-width: 280px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--muted); text-align: left; }
.addb b { display: flex; align-items: center; gap: 4px; color: var(--ink); }
.addb:hover, .hnd:hover { border-color: var(--accent-line); color: var(--ink); }
.arr { position: relative; outline: 1px dashed var(--accent-line); outline-offset: 4px; border-radius: var(--r); animation: jig 1.6s ease-in-out var(--d) infinite alternate; }
.arr:hover, .arr:focus-within { animation: none; }
@keyframes jig { from { transform: rotate(-.5deg); } to { transform: rotate(.5deg); } }
.arr > .blk > .bh { display: none; }
.hbar { display: flex; align-items: center; gap: 4px; min-height: 32px; margin: 0 0 8px; }
.hbar b { margin-right: auto; }
.hnd { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--surface); color: var(--ink-2); }
.hnd[disabled] { opacity: .4; cursor: default; }
.grip { display: grid; place-items: center; width: 24px; height: 32px; margin-left: -4px; color: var(--muted); cursor: grab; touch-action: none; }
.arr.drag { z-index: 30; animation: none; box-shadow: var(--shadow); background: var(--page); }
.dropline { position: fixed; z-index: 40; height: 3px; border-radius: 999px; background: var(--accent-line); pointer-events: none; }
.arr-empty { margin: 0; padding: 24px 16px; border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--muted); text-align: center; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,360px),1fr)); gap: 16px; align-items: start; }
.hb { display: grid; grid-template-columns: minmax(64px,160px) minmax(0,1fr) auto; gap: 8px 12px; align-items: center; padding: 12px; }
.hb .l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .b { display: block; height: 8px; border-radius: 0 3px 3px 0; background: var(--accent-line); min-width: 3px; }
.hb .v { font-variant-numeric: tabular-nums; text-align: right; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tbl th, .tbl td { overflow-wrap: break-word; hyphens: auto; }
.tbl th:first-child { width: 24%; }
.tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.bbx > li { display: grid; gap: 4px; }
.bbx .top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.filters .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.cv { display: grid; grid-template-columns: 280px minmax(0,1fr) 264px; gap: 16px; align-items: start; }
.cl { overflow: hidden; position: sticky; top: 16px; }

    var m = document.querySelector('meta[name="uak-page"]'), mine = m ? m.content : "", theirs = window.UAK_DATA && window.UAK_DATA.page, stored = "";
    try { stored = sessionStorage.getItem("uak-page-tried") || ""; } catch (e) {}
    var plan = reloadPlan(mine, theirs, stored, location.search);
    NEWER = plan === "notice";
    if (plan !== "reload") return false;
    try { sessionStorage.setItem("uak-page-tried", theirs); } catch (e) {}
    location.href = location.pathname + "?uak=" + theirs + (location.hash || ""); return true;
  }
  function reload() {
    var s = document.createElement("script"); s.src = "data.js?t=" + Date.now();
    s.onload = function () { if (newerPage()) return; if (window.UAK_DATA && window.UAK_DATA.generated !== lastGen) render(); else fresh(); s.remove(); };
    s.onerror = function () { s.remove(); };
    document.body.appendChild(s);
  }
  if (!window.UAK_EMBEDDED) setInterval(reload, 1000 * Math.max(5, (window.UAK_DATA && window.UAK_DATA.refresh) || 20));
  document.addEventListener("uak:state", function () { if (window.UAK_DASH_LOOK) UAKLook.set(window.UAK_DASH_LOOK, false); if (window.UAKWorkspace && window.UAK_DASH_LANGUAGE) UAKWorkspace.setLanguage(window.UAK_DASH_LANGUAGE); else render(); });
  window.addEventListener("uak:language", function () { render(); if(window.UAKWorkspace){UAKWorkspace.apply(document.body);mountLanguage();} reportSize(); });
  // A hook for the tests: draw one tab from the given data (test_dashboard_truth drives it under node with a stub document).
  window.UAK_TEST_RENDER = function (tab, data, extra) { window.UAK_DATA = data; ui.tab = tab; for (var k in extra || {}) ui[k] = extra[k]; render(); return document.getElementById("view"); };
  function reportSize() { if(window.UAK_EMBEDDED)window.parent.postMessage({type:"uak:dashboard-size",height:document.documentElement.scrollHeight},"*"); }
  if(window.UAKWorkspace)UAKWorkspace.start(document.body);
  if(window.UAK_EMBEDDED){document.querySelector(".head").hidden=true;document.getElementById("embedded-title").hidden=false;}

})();
</script>
