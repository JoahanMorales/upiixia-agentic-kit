# UPIIXIA Agentic Kit · Codex (marathon mode). Installed as .codex/config.toml (project layer; trust the project).
# Sol leads, Luna swarms, Astra advises at the 3 checkpoints: .uak/docs/ORCHESTRATION.md
# Older accounts or the GPT-5.6 rollout: lead gpt-5.6-terra, swarm gpt-5.6-luna, strong gpt-5.6-sol.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

# The harness as native tools (uak_next, uak_wait, uak_map, …): .uak/bin/uak-mcp, Python 3.8+ standard library.
# Started through git: it is on PATH everywhere and runs the alias in its own shell at the repo root (a bare
# "bash" on Windows is often WSL's launcher in System32).
[mcp_servers.uak]
command = "git"
args = ["-c", "alias.uak-mcp=!for p in python3 python py; do \"$p\" -c 'import sys; sys.exit(sys.version_info < (3, 8))' 2>/dev/null && exec \"$p\" .uak/bin/uak-mcp; done; echo 'uak-mcp needs Python 3.8+ (the uak CLI works without it)' >&2; exit 1", "uak-mcp"]
startup_timeout_sec = 20
# Over the server's own limits (a merge gate gets 900 s): a shorter client timeout dropped a merge's result.
tool_timeout_sec = 1200
