<section class="screen" id="screen-schedule" data-screen="schedule" aria-labelledby="h-schedule">
<div class="wz-body"><div class="wz-main">
<h1 id="h-schedule" tabindex="-1">Set the event schedule</h1>
<form class="prepare-step" id="schedule-form" novalidate>

<p class="step-done" id="schedule-done" hidden>
<strong><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>Done</strong>
<span id="schedule-done-text" data-no-i18n></span>
<button type="button" class="link-button" id="schedule-reopen">Change</button>
</p>
<div class="step-body">
<p class="hint">
The kit stops new work before the deadline (the freeze), so the
last minutes go to the demo.
</p>
<div class="prepare-row">
<div>
<label class="field-label" for="schedule-start">Start</label>
<input type="datetime-local" id="schedule-start" required />
</div>
<div>
<label class="field-label" for="schedule-end">End</label>
<input type="datetime-local" id="schedule-end" required />
</div>
<div>
<label class="field-label" for="schedule-zone">Time zone</label>
<input type="text" id="schedule-zone" list="schedule-zones" autocomplete="off" spellcheck="false" />
<datalist id="schedule-zones"></datalist>
</div>
</div>

<p class="hint" id="schedule-status" role="status"></p>
</div>
</form>
</div>
<aside class="wz-prev" aria-label="What this step changes" data-i18n-aria="What this step changes"><div class="win"><div class="win-h"><i></i><i></i><i></i><span id="win-schedule-title">the clock</span></div><div class="win-b" id="win-schedule-body"></div><div class="win-f" id="win-schedule-foot"></div></div></aside></div>
<footer class="foot"><div class="foot-in"><button type="button" class="ghost" data-exit>Exit</button><div class="foot-note" id="note-schedule"></div><span class="grp" data-unless="schedule-done"><button form="schedule-form" type="submit" class="secondary-button" id="schedule-save" data-p="2">Save schedule</button></span><button type="button" class="primary" id="go-schedule" data-p="1" data-next hidden>Continue</button></div></footer>
</section>
